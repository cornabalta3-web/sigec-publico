<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIGEC — Escribanía General de Gobierno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>
/* Modo oscuro de SIGEC. Una sola preferencia, sigec.tema, que vale para la cáscara y para
   todas las herramientas, estén sueltas o adentro del marco. Va en el <head> para que la
   página nunca se dibuje en claro y pegue el salto. Las páginas file:// comparten
   localStorage, así que cambiarlo en un lado lo cambia en todos. */
(function(){
  var K='sigec.tema';
  function aplicar(t){document.documentElement.setAttribute('data-theme',t==='oscuro'?'dark':'light');}
  function leer(){try{var v=localStorage.getItem(K);return (v==='oscuro'||v==='claro')?v:null;}catch(e){return null;}}
  aplicar(leer()||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'oscuro':'claro'));
  window.SIGEC_TEMA={
    actual:function(){return document.documentElement.getAttribute('data-theme')==='dark'?'oscuro':'claro';},
    poner:function(t){try{localStorage.setItem(K,t);}catch(e){}aplicar(t);this.avisar();},
    alternar:function(){this.poner(this.actual()==='oscuro'?'claro':'oscuro');},
    avisar:function(){document.dispatchEvent(new CustomEvent('sigec:tema'));}
  };
  /* Si lo cambian en otra ventana o en el marco de al lado, esta se entera sola. */
  window.addEventListener('storage',function(e){if(e.key===K&&e.newValue){aplicar(e.newValue);window.SIGEC_TEMA.avisar();}});
})();
</script>
<style>
/* Diseño D (02/11/2026, elegido por Baltasar entre seis propuestas): el menú lateral en azul,
   de arriba abajo, con el dorado marcando dónde estás; cada herramienta con su ícono en su
   color y un punto que dice el estado. Adentro, fondo gris claro y tarjetas blancas. */
:root{--lado:#172A52;--lado-tx:#D9E2F0;--lado-mut:#8EA3C4;--lado-hov:rgba(255,255,255,.07);--lado-act:rgba(255,255,255,.11);
 --oro:#C9A84C;--bg:#F6F7F9;--card:#FFFFFF;--ink:#172033;--mut:#5B6478;--line:#E4E7EC;--line-s:#F0F2F5;
 --uso-tx:#067647;--uso-bg:#ECFDF3;--uso-pt:#17B26A;--pr-tx:#B54708;--pr-bg:#FFFAEB;--pr-pt:#F79009;--foco:#C9A84C}
/* oscuro: cambia todo el fondo; el lateral se oscurece un poco más */
html[data-theme="dark"]{--lado:#0E1A33;--bg:#0F1420;--card:#161C2B;--ink:#E6EAF2;--mut:#98A2B3;--line:#262F42;--line-s:#1D2535;
 --uso-tx:#75E0A7;--uso-bg:#0E2A1C;--pr-tx:#FEC84B;--pr-bg:#33240A}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);
 font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
svg{display:block;flex:0 0 auto}
[hidden]{display:none!important}

.app{display:flex;height:100vh}

/* ---------- el lateral ---------- */
.lado{flex:0 0 264px;background:var(--lado);color:var(--lado-tx);display:flex;flex-direction:column;gap:18px;
 padding:18px 14px 14px;overflow-y:auto}
/* Plegar el lateral lo desliza (Baltasar, 03/11/2026: «no se desplaza suavemente»); plegado
   queda invisible, para que el tabulador no entre ahí. */
.lado{transition:margin-left .24s ease,visibility 0s}
.app.plegado .lado{margin-left:-264px;visibility:hidden;transition:margin-left .24s ease,visibility 0s linear .24s}
.marca{display:flex;align-items:center;gap:12px;padding:4px 6px 16px;border:0;border-bottom:1px solid rgba(201,168,76,.45);
 background:none;text-align:left;cursor:pointer;border-radius:0}
.sello{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--oro);color:#172A52;
 font-size:18px;font-weight:800}
.marca .tx{display:flex;flex-direction:column;line-height:1.25}
.marca .s1{font-size:17px;font-weight:800;color:#fff;letter-spacing:.01em}
.marca .s2{font-size:12.5px;color:var(--lado-mut)}

.buscar{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px 0 12px;border:1px solid rgba(255,255,255,.10);
 border-radius:10px;background:rgba(255,255,255,.06);color:var(--lado-mut)}
.buscar:focus-within{border-color:rgba(201,168,76,.7)}
.buscar input{flex:1;min-width:0;border:0;background:none;color:#fff;font:inherit;font-size:14px;outline:none}
.buscar input::placeholder{color:var(--lado-mut);opacity:1}
.kbd{font-size:12px;font-weight:600;padding:1px 6px;border-radius:5px;border:1px solid rgba(255,255,255,.16);white-space:nowrap}

.nav{display:flex;flex-direction:column;gap:16px}
.grupo{display:flex;flex-direction:column;gap:2px}
.grupo .gt{padding:0 8px 6px;font-size:12.5px;font-weight:600;color:var(--lado-mut)}
.item{display:flex;align-items:center;gap:11px;width:100%;padding:7px 8px;border:0;border-radius:9px;background:none;
 color:var(--lado-tx);font-size:14.5px;font-weight:500;text-align:left;cursor:pointer}
.item:hover{background:var(--lado-hov)}
.item.on{background:var(--lado-act);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--oro)}
.item.prep{opacity:.55;cursor:default}
.item.prep:hover{background:none}
.item .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;
 color:var(--i);background:var(--ib)}
.item .nm{flex:1;min-width:0;line-height:1.3}
.item .ext{color:var(--lado-mut)}
.pt{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.pt.uso{background:var(--uso-pt)}
.pt.pr{background:var(--pr-pt)}
.pt.prep{box-shadow:inset 0 0 0 1.5px var(--lado-mut)}
.otros{align-self:flex-start;display:flex;align-items:center;gap:6px;padding:6px 8px;border:0;border-radius:8px;
 background:none;color:var(--lado-mut);font-size:13.5px;font-weight:600;cursor:pointer}
.otros:hover,.otros[aria-expanded="true"]{color:var(--lado-tx);background:var(--lado-hov)}
.otras{display:flex;flex-direction:column;gap:2px}
.vacio{padding:6px 8px;font-size:13.5px;color:var(--lado-mut)}

.pie{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 6px 0;border-top:1px solid rgba(255,255,255,.10)}
.pie .tx{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.pie .q{font-size:13.5px;font-weight:600;color:#fff}
.pie .sigec-version{font-size:12.5px;color:var(--lado-mut)}
.tema{margin-left:auto;width:38px;height:38px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);
 border-radius:10px;background:none;color:var(--lado-tx);cursor:pointer}
.tema:hover{background:var(--lado-hov)}

/* ---------- la barra de arriba: dónde estás ---------- */
.panel{flex:1;min-width:0;display:flex;flex-direction:column}
.barra{flex:0 0 auto;min-height:60px;display:flex;align-items:center;gap:10px;padding:8px 24px 8px 14px;background:var(--card);
 border-bottom:1px solid var(--line);font-size:14px;color:var(--mut)}
.ico{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:var(--card);
 color:var(--ink);cursor:pointer;flex:0 0 auto}
.ico:hover{border-color:var(--mut)}
.miga{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}
.miga b{overflow:hidden;text-overflow:ellipsis}
.miga button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 2px;color:var(--mut);cursor:pointer;font-size:14px}
.miga button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.miga b{color:var(--ink);font-weight:600}
.miga .sola{color:var(--ink);font-weight:600}
.et{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.et i{width:6px;height:6px;border-radius:50%}
.et.uso{color:var(--uso-tx);background:var(--uso-bg)} .et.uso i{background:var(--uso-pt)}
.et.pr{color:var(--pr-tx);background:var(--pr-bg)} .et.pr i{background:var(--pr-pt)}
.et.prep{color:var(--mut);box-shadow:inset 0 0 0 1px var(--line)} .et.prep i{box-shadow:inset 0 0 0 1.5px var(--mut)}
.barra .s{font-size:13.5px;color:var(--mut);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra .der{margin-left:auto}
iframe{flex:1;width:100%;border:0;background:var(--bg);min-height:0}

/* ---------- el inicio ---------- */
.inicio{flex:1;overflow-y:auto;padding:36px 40px 48px}
.inicio .wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:20px 28px;flex-wrap:wrap}
.cab h1{margin:0 0 6px;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.cab p{margin:0;font-size:16px;color:var(--mut)}
.logos{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 18px}
.logos img{display:block;height:44px;width:auto;max-width:100%}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:16px}
.tj{display:flex;flex-direction:column;gap:14px;padding:20px;background:var(--card);border:1px solid var(--line);
 border-radius:16px;text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.04);
 transition:box-shadow .15s,border-color .15s}
.tj:hover{box-shadow:0 10px 28px rgba(16,24,40,.10);border-color:transparent}
.tj.prep{cursor:default;border-style:dashed;box-shadow:none}
.tj.prep:hover{box-shadow:none;border-color:var(--line)}
.tj .tc{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--c);color:#fff}
.tj .tx{display:flex;flex-direction:column;gap:4px}
.tj .g{font-size:12.5px;font-weight:600;color:var(--mut)}
.tj .n{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.tj .d{font-size:14px;line-height:1.5;color:var(--mut)}

/* ---------- angosto: el lateral pasa a ser un cajón ---------- */
.velo{display:none}
@media(max-width:820px){
 .lado{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:30;transform:translateX(-102%);
  transition:transform .2s ease}
 .app.plegado .lado{margin-left:0;visibility:visible}
 .app.abierto .lado{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.30)}
 .app.abierto .velo{display:block;position:fixed;inset:0;z-index:20;background:rgba(10,16,30,.45)}
 .barra{padding:8px 12px}
 .barra .s,#btnInicio,#mFlecha{display:none!important}
 .inicio{padding:24px 16px 32px}
 .cab h1{font-size:26px}
 .logos img{height:36px}
}
@media(prefers-reduced-motion:reduce){.lado,.app.plegado .lado,.tj{transition:none}}
/* Cambiar de herramienta sin salto (Baltasar, 03/11/2026): la herramienta aparece con un
   fundido cuando terminó de cargar, y la portada entra igual. */
@media(prefers-reduced-motion:no-preference){
 #marco{transition:opacity .22s ease}
 #marco.cargando{opacity:0}
 #inicio{animation:inicioEntra .22s ease-out}
 @keyframes inicioEntra{from{opacity:0;transform:translateY(6px)}}
}
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="lado" id="lado">
    <button class="marca" id="btnMarca" type="button" title="Ir al inicio de SIGEC">
      <span class="sello" aria-hidden="true">S</span>
      <span class="tx"><span class="s1">SIGEC</span><span class="s2">Escribanía General de Gobierno</span></span>
    </button>

    <!-- Ctrl K (o ⌘K) lo enfoca desde cualquier lugar del menú; Enter abre la primera que aparece. -->
    <label class="buscar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="buscar" type="search" placeholder="Buscar" aria-label="Buscar una herramienta" autocomplete="off">
      <span class="kbd" aria-hidden="true">Ctrl K</span>
    </label>

    <nav class="nav" id="nav" aria-label="Herramientas"></nav>

    <div class="pie">
      <span class="tx"><span class="q" id="quien">Escribanía</span><span class="sigec-version">Versión del 06/11/2026</span></span>
      <button class="tema" id="btnTema" type="button"></button>
    </div>
  </aside>
  <div class="velo" id="velo"></div>

  <div class="panel">
    <div class="barra" id="barra">
      <button class="ico" id="btnMenu" type="button" aria-label="Mostrar u ocultar el menú" title="Mostrar u ocultar el menú">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav class="miga" aria-label="Dónde estás">
        <span class="sola" id="mInicio">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5M6 9.5V19h12V9.5"/></svg>
        </span>
        <span class="sola" id="mInicioTx">Inicio</span>
        <button type="button" id="btnInicio" hidden title="Volver al inicio de SIGEC"></button>
        <svg id="mFlecha" hidden width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        <b id="bTit" hidden></b>
      </nav>
      <span class="et" id="bEst" hidden></span>
      <span class="s" id="bSub"></span>
      <button class="ico der" id="btnNueva" type="button" hidden aria-label="Abrir en pestaña nueva" title="Abrir en pestaña nueva">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      </button>
    </div>

    <div class="inicio" id="inicio"><div class="wrap">
      <div class="cab">
        <div>
          <h1>Herramientas</h1>
          <p>Elegí con qué vas a trabajar. Todo se guarda en esta computadora.</p>
        </div>
        <div class="logos"><img src="egg-logos.png" alt="Escribanía de Gobierno · Provincia de Córdoba"></div>
      </div>
      <div class="tarjetas" id="tarjetas"></div>
    </div></div>

    <iframe id="marco" title="Herramienta" allow="clipboard-write" style="display:none"></iframe>
  </div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

/* En oscuro, el mismo color no sirve: el azul casi negro del recibo desaparece sobre
   fondo oscuro. Por eso cada producto lleva su variante aclarada en colorOsc.
   El color de cada producto NO es decorativo: es el que la herramienta ya tiene, y por
   el que el usuario se da cuenta de dónde está. El verde del primer testimonio es el de
   la hoja de actuación notarial; el rojo del rogador, el del sello. Si una herramienta
   cambia de color, se cambia también acá: el menú y la herramienta tienen que decir lo
   mismo. Las que todavía no están operativas llevan un color provisorio. */
const HERRAMIENTAS=[
 {id:"ddjj",grupo:"Declaraciones juradas",n:"DDJJ",estado:"uso",color:"#144D83",colorOsc:"#5BA3E0",
  d:"Escritura de declaración jurada patrimonial de funcionarios, a partir del PDF presentado.",
  url:"productos/ddjj/ddjj.html"},
 {id:"recibo",grupo:"Declaraciones juradas",n:"Recibo",estado:"uso",color:"#1A2744",colorOsc:"#8FA8D4",
  d:"La constancia de recepción de la DDJJ, y el recibí de un testimonio o una copia.",
  url:"productos/recibo-ddjj/recibo-ddjj.html"},
 {id:"testimonio",grupo:"Escrituración",n:"Primer testimonio",estado:"uso",color:"#3E9480",colorOsc:"#5FB8A1",
  d:"Convierte la escritura de protocolo en primer testimonio, con folio, cierre y concordancia.",
  url:"productos/primer-testimonio/primer-testimonio.html"},
 {id:"rogador",grupo:"Escrituración",n:"Rogador",estado:"uso",color:"#A81419",colorOsc:"#E2685F",
  d:"Rogación de inscripción para el Registro General de la Provincia.",
  url:"productos/rogador/rogador.html"}
];

/* Los tres estados. Antes "operativo" se decía callando: la herramienta en uso no llevaba
   ninguna etiqueta y había que darse cuenta de que la ausencia significaba algo. Ahora los
   tres se dicen igual de fuerte, con el mismo chip en el menú y en la tarjeta. */
const ESTADOS={
 uso:         {et:"En uso",          cls:"uso",  corto:"en uso",  ayuda:"Se usa todos los días en la Escribanía."},
 prototipo:   {et:"Prototipo",       cls:"pr",   corto:"prototipo", ayuda:"Anda, pero todavía no es de uso diario: lo que salga de acá se revisa igual."},
 preparacion: {et:"En preparación",  cls:"prep", corto:"en preparación", ayuda:"Todavía no se puede abrir."}
};
const est = h => ESTADOS[h.estado] || ESTADOS.preparacion;
const abrible = h => h.estado!=="preparacion" && !!h.url;

/* El ícono de cada herramienta, por su id. Va aparte de HERRAMIENTAS para no tocar esa lista:
   la editan los chats de cada producto. Son trazos de 24×24, sin relleno. */
const ICONOS={
 ddjj:"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6",
 recibo:"M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3",
 turnero:"M5.5 5h13a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM3.5 10h17M8 3v4M16 3v4",
 cotejo:"M4 6h7M4 12h7M4 18h7M14.5 7l2 2 4-4M14.5 17l2 2 4-4",
 consulta:"M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4.8-4.8",
 testimonio:"M10 8h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2zM16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h2",
 rogador:"M3 21h18M5 21V10M19 21V10M9.5 21V10M14.5 21V10M2.5 10L12 4l9.5 6z",
 sociales:"M3.5 11L12 4l8.5 7M6 9.5V20h12V9.5M10 20v-5h4v5",
 expro:"M4 7l5-3 6 3 5-3v13l-5 3-6-3-5 3zM9 4v13M15 7v13",
 modelos:"M12 3l9 5-9 5-9-5zM3 13l9 5 9-5",
 redes:"M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM3 16l5-5 4 4 3-3 6 6M15.5 8.5h.01"
};
const ICONO_COMUN="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5";
const svg=(d,t)=>`<svg width="${t}" height="${t}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${t>18?1.9:2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const icono=(h,t)=>svg(ICONOS[h.id]||ICONO_COMUN,t);
const FLECHA_AFUERA="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- claro / oscuro ---------- */
const LUNA="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z";
const SOL="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4";
function pintarTema(){
 const osc=SIGEC_TEMA.actual()==="oscuro", t=osc?"Modo claro":"Modo oscuro";
 $("#btnTema").innerHTML=svg(osc?SOL:LUNA,17);
 $("#btnTema").title=t; $("#btnTema").setAttribute("aria-label",t);
}
$("#btnTema").addEventListener("click",()=>{SIGEC_TEMA.alternar();});
document.addEventListener("sigec:tema",()=>{ pintarTema(); pintarNav(); pintarTarjetas(); });
pintarTema();

/* ---------- navegación lateral ---------- */
/* En el lateral azul, el ícono va siempre en la variante clara del color: la oscura no se ve. */
function colorDe(h){ return (SIGEC_TEMA.actual()==="oscuro" && h.colorOsc) ? h.colorOsc : h.color; }
const claroDe=h=>h.colorOsc||h.color;
/* Una herramienta con oculto:true no figura entre las demás ni en el inicio: queda detrás de
   «Otros», el botón chico del pie del menú. También se abre con su archivo o con el menú
   terminado en #<id> (por ejemplo «SIGEC, APP.html#cotejo»). */
const VISIBLES=()=>HERRAMIENTAS.filter(h=>!h.oculto);
const OCULTAS=()=>HERRAMIENTAS.filter(h=>h.oculto);
let OTROS=false;   // «Otros» desplegado; empieza cerrado cada vez que se abre el menú
let BUSCA="";      // lo escrito en «Buscar»
const sinTildes=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const coincide=h=>!BUSCA||sinTildes(h.n+" "+h.grupo).includes(sinTildes(BUSCA));
const enlace=h=>`<button type="button" data-h="${h.id}" class="item${abrible(h)?"":" prep"}${ACTUAL&&ACTUAL.id===h.id?" on":""}" title="${esc(est(h).et+". "+est(h).ayuda)}"${ACTUAL&&ACTUAL.id===h.id?' aria-current="page"':""}>`
 +`<span class="ic" style="--i:${claroDe(h)};--ib:${claroDe(h)}29">${icono(h,16)}</span>`
 +`<span class="nm">${esc(h.n)}</span>`
 +(h.externo||h.ventana?`<span class="ext" title="Se abre en otra pestaña">${svg(FLECHA_AFUERA,13)}</span>`:"")
 +`<span class="pt ${est(h).cls}"></span></button>`;
function pintarNav(){
 const lista=VISIBLES().filter(coincide);
 const grupos=[...new Set(lista.map(h=>h.grupo))];
 const ocultas=OCULTAS().filter(coincide);
 /* Buscando, las de «Otros» aparecen sólo si «Otros» ya estaba abierto: no se muestran solas. */
 $("#nav").innerHTML=grupos.map(g=>
  `<div class="grupo"><div class="gt">${esc(g)}</div>`+lista.filter(h=>h.grupo===g).map(enlace).join("")+`</div>`
 ).join("")
 +(BUSCA&&!lista.length&&!(OTROS&&ocultas.length)?`<div class="vacio">No hay ninguna con «${esc(BUSCA)}».</div>`:"")
 +(OCULTAS().length&&!BUSCA?`<button type="button" class="otros" id="btnOtros" aria-expanded="${OTROS}" title="Herramientas que todavía no son para todos">Otros ${svg(OTROS?"M6 9l6 6 6-6":"M9 6l6 6-6 6",12)}</button>`:"")
 +(OTROS&&ocultas.length?`<div class="otras">${ocultas.map(enlace).join("")}</div>`:"");
 $$("[data-h]").forEach(a=>a.addEventListener("click",()=>abrir(a.dataset.h)));
 const o=$("#btnOtros"); if(o) o.addEventListener("click",()=>{ OTROS=!OTROS; pintarNav(); });
}

/* ---------- buscar ---------- */
$("#buscar").addEventListener("input",e=>{ BUSCA=e.target.value.trim(); pintarNav(); });
$("#buscar").addEventListener("keydown",e=>{
 if(e.key==="Enter"){ const p=$("#nav [data-h]:not(.prep)"); if(p){ e.target.value=""; BUSCA=""; e.target.blur(); abrir(p.dataset.h); } }
 if(e.key==="Escape"){ e.target.value=""; BUSCA=""; pintarNav(); e.target.blur(); }
});
document.addEventListener("keydown",e=>{
 if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==="k"){
  e.preventDefault();
  if(window.innerWidth<=820) $("#app").classList.add("abierto");
  $("#app").classList.remove("plegado");
  $("#buscar").focus(); $("#buscar").select();
 }
});

/* ---------- tarjetas del inicio ---------- */
function pintarTarjetas(){
 $("#tarjetas").innerHTML=VISIBLES().map(h=>
  `<button type="button" class="tj${abrible(h)?"":" prep"}" ${abrible(h)?`data-t="${h.id}"`:"disabled"} style="--c:${h.color}">
    <span class="tc"><span class="tile">${icono(h,22)}</span><span class="et ${est(h).cls}" title="${esc(est(h).ayuda)}"><i></i>${est(h).et}</span></span>
    <span class="tx"><span class="g">${esc(h.grupo)}</span><span class="n">${esc(h.n)}</span><span class="d">${esc(h.d)}</span></span>
  </button>`).join("");
 $$("[data-t]").forEach(e=>e.addEventListener("click",()=>abrir(e.dataset.t)));
}

/* ---------- abrir una herramienta ---------- */
let ACTUAL=null;
/* La pestaña que el menú abre aparte lleva un nombre que empieza con «sigec-»: con eso, su
   «Volver a SIGEC» sabe que el menú quedó abierto atrás y la cierra, en vez de ir al menú que
   tenga al lado (desde GitHub, la copia pública de cuatro herramientas). Uno nuevo cada vez:
   un nombre repetido recargaría la pestaña que ya estaba abierta. */
const nombreVentana=h=>"sigec-"+h.id+"-"+Date.now().toString(36);
function cerrarCajon(){ $("#app").classList.remove("abierto"); }
function abrir(id,desdeDireccion){
 const h=HERRAMIENTAS.find(x=>x.id===id);
 if(!h||!abrible(h)) return;
 /* Una herramienta que vive en GitHub (externo) se abre en otra pestaña, no en el marco (Baltasar, 26/10/2026: el cotejo,
    «que el original y el único sea el de GitHub»). Pedida por la dirección (#cotejo) no hay clic que habilite otra
    pestaña: se va directo. */
 /* Con una marca distinta cada vez, el navegador no usa una copia guardada: GitHub deja cada página hasta diez
    minutos, y desde casa se veía la versión de antes (Baltasar, 06/11/2026: «no veo los cambios»). */
 if(h.externo){ const u=h.url+(h.url.includes("?")?"&":"?")+"v="+Date.now().toString(36); if(desdeDireccion) location.href=u; else window.open(u,nombreVentana(h),"noopener"); return; }
 /* Escrituras sociales (ventana:true) se comparte por una carpeta del R:, y adentro del marco Chrome no deja usar
    carpetas: se abre directo en su ventana, para que no se pueda trabajar en el lugar donde no se comparte
    (Baltasar, 03/11/2026). */
 if(h.ventana){ if(desdeDireccion) location.href=h.url; else window.open(h.url,nombreVentana(h)); return; }
 ACTUAL=h;
 /* Abierta desde #cotejo, se despliega «Otros» para que se vea dónde está. */
 if(h.oculto&&!OTROS) OTROS=true;
 pintarNav();
 const m=$("#marco"); m.classList.add("cargando"); m.onload=()=>m.classList.remove("cargando"); setTimeout(()=>m.classList.remove("cargando"),1500);
 m.src=h.url;
 $("#marco").style.display="";
 $("#inicio").style.display="none";
 /* El camino: «Grupo › Herramienta». El grupo vuelve al inicio. */
 $("#mInicio").hidden=true; $("#mInicioTx").hidden=true;
 $("#btnInicio").hidden=false; $("#btnInicio").textContent=h.grupo;
 $("#mFlecha").removeAttribute("hidden"); $("#bTit").hidden=false; $("#bTit").textContent=h.n;
 $("#bEst").hidden=false; $("#bEst").className="et "+est(h).cls; $("#bEst").innerHTML="<i></i>"+est(h).et;
 $("#bEst").title=est(h).ayuda;
 /* Sólo un prototipo dice algo más: que lo que sale de ahí se revisa igual. */
 $("#bSub").textContent=h.estado==="uso"?"":est(h).ayuda;
 $("#btnNueva").hidden=false;
 cerrarCajon();
}
function inicio(){
 ACTUAL=null;
 $("#marco").style.display="none"; $("#marco").src="about:blank";
 $("#inicio").style.display="";
 $("#mInicio").hidden=false; $("#mInicioTx").hidden=false;
 $("#btnInicio").hidden=true; $("#mFlecha").setAttribute("hidden",""); $("#bTit").hidden=true;
 $("#bEst").hidden=true; $("#bSub").textContent=""; $("#btnNueva").hidden=true;
 pintarNav(); cerrarCajon();
}
$("#btnInicio").addEventListener("click",inicio);
$("#btnMarca").addEventListener("click",inicio);
$("#btnNueva").addEventListener("click",()=>{ if(ACTUAL) window.open(ACTUAL.url,nombreVentana(ACTUAL)); });
$("#velo").addEventListener("click",cerrarCajon);
$("#btnMenu").addEventListener("click",()=>{
 const c=$("#app");
 /* Ancho: pliega el lateral para dar lugar a la herramienta. Angosto: abre el cajón. Los
    dos modos se excluyen, para que no se peleen si la ventana cambia de ancho. */
 if(window.innerWidth<=820){ c.classList.remove("plegado"); c.classList.toggle("abierto"); }
 else { c.classList.remove("abierto"); c.classList.toggle("plegado"); }
});

pintarNav(); pintarTarjetas();
/* «SIGEC, APP.html#cotejo» abre esa herramienta, también una que no figura en el menú. */
const pedida=()=>{ const id=decodeURIComponent(location.hash.slice(1)); if(id&&HERRAMIENTAS.some(h=>h.id===id)) abrir(id,true); };
window.addEventListener("hashchange",pedida); pedida();
</script>
</body>
</html>
