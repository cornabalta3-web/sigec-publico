<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escrituras sociales</title>
<!-- el escudo de la EGG en la pestaña y en la pantalla de inicio del celular («Agregar a inicio»), 19/11/2026 -->
<link rel="icon" href="../../egg.ico?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="../../egg-192.png?v=2">
<link rel="apple-touch-icon" href="../../egg-180.png?v=2">
<link rel="manifest" href="../../sigec.webmanifest">
<meta name="theme-color" content="#1A2744">
<meta name="apple-mobile-web-app-title" content="Escrituras sociales">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<!-- Cambria no se pide a ningún lado: es la fuente del protocolo y está instalada en las
     máquinas de la Escribanía. Donde no esté, cae en Georgia, que también es serif. -->
<script>
/* El mismo bloque de tema que llevan todas las herramientas de SIGEC. Va en el <head> para
   que la página nunca se dibuje en claro y pegue el salto. */
(function(){
  var K='sigec.tema';
  function aplicar(t){document.documentElement.setAttribute('data-theme',t==='oscuro'?'dark':'light');}
  function leer(){try{var v=localStorage.getItem(K);return (v==='oscuro'||v==='claro')?v:null;}catch(e){return null;}}
  if(!document.documentElement.getAttribute('data-theme'))
    aplicar(leer()||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'oscuro':'claro'));
  window.SIGEC_TEMA={
    actual:function(){return document.documentElement.getAttribute('data-theme')==='dark'?'oscuro':'claro';},
    poner:function(t){try{localStorage.setItem(K,t);}catch(e){}aplicar(t);},
    alternar:function(){this.poner(this.actual()==='oscuro'?'claro':'oscuro');}
  };
})();
</script>
<style>
/* ═══ los mismos tokens que el resto de SIGEC ═══ */
:root{
 --acc:#B5533C;--acc-s:#FBEFEC;
 --navy:#1B2F5E;--bone:#EEF2F5;--line:#D8E0EA;--muted:#65748C;--tx:#1E2634;--pap:#fff;
 --ok:#1F6B3C;--ok-bg:#E6F3EB;--warn:#8A6A12;--warn-bg:#FBF3DC;--bad:#A81419;--bad-bg:#FBEAEA;
 --cel:#2E5385;--cel-bg:#E8F0F9;--marca:#FFF3C4;--marca-bd:#E8D389;--marca-tx:#1E2634;
}
html[data-theme="dark"]{
 --acc:#E08A6F;--acc-s:#2E1E19;
 --navy:#16233F;--bone:#12181F;--line:#2E3A47;--muted:#94A3B5;--tx:#E4E9EE;--pap:#1B232C;
 --ok:#7FD9A6;--ok-bg:#14301F;--warn:#E8C37A;--warn-bg:#3A2C10;--bad:#F09A93;--bad-bg:#3A1414;
 --cel:#A9C6E6;--cel-bg:#1B2A3D;--marca:#4A3A12;--marca-bd:#7A6321;--marca-tx:#F2E7C8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--bone);color:var(--tx);
 font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}

/* ═══ la cáscara: no cambia nunca, sólo el camino y los botones ═══ */
.cinta{background:var(--navy);color:#A9BFDA;font-size:10.5px;letter-spacing:.13em;
 text-transform:uppercase;text-align:center;padding:5px;font-weight:600}
.top{background:var(--pap);border-bottom:3px solid var(--acc);padding:13px 20px;
 display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
.top h1{margin:0;font-size:18px;font-weight:700;color:var(--acc);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.top .sub{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:0;flex-wrap:wrap}
.top .sub b{color:var(--tx);font-weight:700}
.top .sub .sep{color:var(--line);margin:0 6px}
.top .sub button.link{font-size:12.5px}
.top .acc{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top .proto{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;
 border-radius:999px;padding:3px 10px;color:var(--warn);background:var(--warn-bg)}
.guardado{font-size:11.5px;color:var(--muted)}
/* el chip de la carpeta compartida, al lado del título */
#compartido:empty{display:none}
#compartido button,#compartido span{font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;border-radius:999px;padding:3px 11px;line-height:1.4}
#compartido .ok{color:var(--ok);background:var(--ok-bg);border:1px solid transparent}
#compartido .mal{color:var(--bad);background:var(--bad-bg);border:1px solid transparent}
#compartido .no{color:var(--muted);background:var(--bone);border:1px solid var(--line)}
#compartido .ir{color:var(--acc);background:var(--pap);border:1.5px solid var(--acc)}
#compartido .solo{color:var(--warn);background:var(--warn-bg);border:1px solid transparent}
.diag-comp{font-size:12.5px;line-height:1.5;margin:10px 0 0}
.diag-comp code{font-size:11.5px;word-break:break-all}

button{font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;border-radius:7px;
 padding:7px 13px;border:1.5px solid var(--line);background:var(--pap);color:var(--tx)}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.ch{padding:4px 9px;font-size:11.5px}
button.ch.borrar{color:var(--bad);border-color:transparent}
.top .acc button.borrar{color:var(--bad)}
/* los lotes de quien usa esta computadora (12/11/2026): una raya del color de la herramienta y «tuyo» */
tr.fila.mio{background:color-mix(in srgb,var(--acc) 6%,transparent)}
tr.fila.mio td:first-child{box-shadow:inset 4px 0 0 var(--acc)}
tbody tr.fila.mio:hover{background:var(--acc-s)}
.tuyo{display:inline-block;font-size:11px;font-weight:700;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px;line-height:16px}
button.link{background:none;border:0;padding:0;color:var(--acc);text-decoration:underline;font-size:inherit;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button:disabled:hover{border-color:var(--line)}

.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 70px}
.v{display:none}
.v.on{display:block}

/* ── títulos de pantalla ── */
.pt{margin:4px 0 2px;font-size:24px;font-weight:700;color:var(--tx);letter-spacing:-.01em;text-wrap:balance}
.ps{margin:0 0 20px;font-size:14px;color:var(--muted)}
.ps code,.chica code,.hint code{font-size:12px;background:var(--acc-s);padding:1px 5px;border-radius:4px}
.st{margin:26px 0 10px;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.vacio{color:var(--muted);font-size:13px;padding:10px 0;font-style:italic}

/* ── avisos ── */
.alerta{border-left:4px solid var(--bad);background:var(--bad-bg);color:var(--bad);
 border-radius:0 9px 9px 0;padding:12px 16px;margin:0 0 18px;font-size:13.5px}
.alerta b{display:block;margin-bottom:3px}
.alerta.calma{border-left-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.alerta.tibia{border-left-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.alerta.cel{border-left-color:var(--cel);background:var(--cel-bg);color:var(--cel)}
.avisobox{background:var(--warn-bg);color:var(--warn);border-radius:9px;padding:10px 13px;margin:12px 0 4px;font-size:12.5px;line-height:1.45}
#aviso{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;max-width:min(560px,92vw);
 background:var(--navy);color:#fff;border-radius:10px;padding:11px 16px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);
 opacity:0;pointer-events:none;transition:opacity .2s}
#aviso.on{opacity:1}
#aviso.grave{background:var(--bad)}

/* ── tarjetas y formularios ── */
.card{background:var(--pap);border:1.5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:14px}
.card h2{margin:0 0 3px;font-size:15.5px;font-weight:700;color:var(--acc)}
.card h2 .cta{float:right;font-size:11.5px;font-weight:600;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
@media(max-width:1040px){.layout{grid-template-columns:minmax(0,1fr)}}
.layout>*{min-width:0}
/* el panel de la derecha acompaña al bajar: si no, la paleta y los datos quedan arriba y hay que volver */
/* la barra de arriba puede ocupar dos renglones (un camino largo y los botones del lote): el panel se
   pone debajo de lo que mida de verdad, --alto-top, que se mide al arrancar y cada vez que cambia */
.layout>aside{position:sticky;top:calc(var(--alto-top,59px) + 15px);max-height:calc(100vh - var(--alto-top,59px) - 31px);overflow:auto;padding-right:2px}
/* la escritura en vivo, a la derecha de los datos (05/11/2026) */
.layout.vivo{grid-template-columns:minmax(0,1fr) minmax(400px,46%)}
@media(max-width:1040px){.layout.vivo{grid-template-columns:minmax(0,1fr)}}
.apanel.vivo .pb{padding:0}
#vivo{max-height:calc(100vh - 250px);min-height:180px;overflow:auto;position:relative}
@media(max-width:1040px){#vivo{max-height:60vh}}
#vivo .escritura{border:0;border-radius:0;font-size:13px;line-height:1.75;padding:14px 16px;white-space:normal}
#vivo .d{background:var(--viv-d);box-shadow:inset 0 -1px 0 var(--viv-d-bd);border-radius:2px}
#vivo .vv{background:var(--marca);box-shadow:inset 0 0 0 1px var(--marca-bd);color:var(--marca-tx);border-radius:3px}
#vivo .hueco{font-size:.92em}
/* elegir la vista, y tocar la escritura para cambiar el dato (05/11/2026) */
.apanel .ph.tabs{padding:0;gap:0}
.apanel .ph.tabs button{flex:1;background:transparent;color:#fff;border:0;border-radius:0;padding:11px 12px;font-weight:700;font-size:13.5px;opacity:.7;cursor:pointer;margin:0;width:auto;font-family:inherit}
.apanel .ph.tabs button.on{opacity:1;box-shadow:inset 0 -3px 0 #fff}
#vivo .escritura{cursor:pointer}
#vivo [data-k]:hover{outline:1px dashed var(--acc);outline-offset:1px}
#faltasVivo{padding:14px 15px}
#faltasVivo p.n{margin:0 0 4px;font-size:15px}
#faltasVivo .lista{font-size:12.5px;color:var(--muted);margin:0 0 10px;padding-left:18px}
.foco-campo{animation:focoCampo 1.6s ease}
@keyframes focoCampo{0%,55%{box-shadow:0 0 0 3px var(--marca-bd)}100%{box-shadow:0 0 0 0 transparent}}
.barrio.foco{box-shadow:0 0 0 2px var(--acc)}
/* editar la escritura donde se la ve (05/11/2026) */
#vivo [data-bi]:hover{background:var(--bone);border-radius:2px}
#vivo .propio{background:var(--viv-p)!important;box-shadow:inset 0 -2px 0 var(--viv-p-bd);border-radius:2px}
.rev-hoja .propio{background:#EBE4FF!important;box-shadow:inset 0 -2px 0 #6941C6;border-radius:2px}
#vivo .propio.vacio,.rev-hoja .propio.vacio{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:.8em;font-style:italic;padding:0 4px}
.leyenda-vivo{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:6px 12px;margin:0;padding:8px 16px;background:var(--pap);border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.leyenda-vivo span{display:inline-flex;align-items:center;gap:5px}
.leyenda-vivo i{display:inline-block;width:14px;height:10px;border-radius:2px;border:1px solid var(--line)}
.leyenda-vivo i.d{background:var(--viv-d);box-shadow:inset 0 -1px 0 var(--viv-d-bd)}.leyenda-vivo i.p{background:var(--viv-p);box-shadow:inset 0 -2px 0 var(--viv-p-bd)}.leyenda-vivo i.v{background:var(--marca);border-color:var(--marca-bd)}
.edvivo{position:absolute;z-index:70;width:min(480px,calc(100vw - 24px));background:var(--pap);border:1.5px solid var(--acc);border-radius:11px;padding:12px 14px;box-shadow:0 14px 36px rgba(15,28,58,.2);font-size:13px}
.edvivo[hidden]{display:none}
.edvivo .t{font-weight:700;color:var(--acc);margin:0 0 2px}
.edvivo .hint{margin:0 0 8px}
.edvivo textarea.inp{min-height:110px;font-size:13px;line-height:1.5}
.edvivo .pbtn{margin:10px 0 0}
@media(max-width:1040px){.layout>aside{position:static;max-height:none;overflow:visible}}
.sigue{border:1.5px solid var(--acc);border-radius:11px;padding:16px 18px;margin-top:14px;background:var(--pap)}
.sigue b{display:block;font-size:14.5px;color:var(--acc);margin-bottom:4px}
.sigue p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.eco.tarde,.obsx.tarde{color:var(--bad);font-weight:600}
/* ── la carátula impresa: una hoja de papel, también en pantalla ── */
.hoja{background:#fff;color:#111;border:1.5px solid var(--line);border-radius:4px;padding:30px 34px;max-width:720px;margin:0 auto;box-shadow:0 10px 34px rgba(15,28,58,.14);font-family:Montserrat,system-ui,sans-serif}
.hoja h3{margin:0 0 3px;font-size:14px;letter-spacing:.1em;text-transform:uppercase;text-align:center}
.hoja .sb{text-align:center;font-size:11px;color:#555;margin:0 0 20px;letter-spacing:.06em;text-transform:uppercase}
.hoja .enc{display:grid;grid-template-columns:1fr 1fr;gap:9px 24px;font-size:13px;margin-bottom:18px}
.hoja .enc div{border-bottom:1px solid #999;padding-bottom:3px;min-height:34px}
.hoja .enc span{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#666;display:block}
.hoja .cas{font-size:12.5px;margin:0 0 18px;display:flex;gap:26px;flex-wrap:wrap}
.hoja table{width:100%;border-collapse:collapse;font-size:12.5px}
.hoja th,.hoja td{border:1px solid #999;padding:7px 8px;text-align:left;color:#111}
.hoja th{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#444;background:#F2F2F2;font-weight:700;white-space:normal}
.hoja td.vac{height:30px}
.hoja tbody tr:hover{background:transparent}
.hoja .obs{margin-top:18px;font-size:12.5px}
.hoja .obs .lin{border-bottom:1px solid #999;height:24px;margin-top:5px}
.hoja .tabla{overflow-x:auto}
.hoja .tabla table{min-width:420px}
@media(max-width:700px){.hoja{padding:18px 16px}.hoja .enc{grid-template-columns:1fr}}
#impCar{display:none}
@media print{
 body.imp-car>*:not(#impCar){display:none!important}
 body.imp-car #impCar{display:block}
 #impCar .hoja{border:0;box-shadow:none;max-width:none;padding:0;margin:0;border-radius:0;break-after:page;page-break-after:always}
 #impCar .hoja:last-child{break-after:auto;page-break-after:auto}
 body{background:#fff}
 .v.on:not(#v-caratula) .escritura{border:0;padding:0}
 #v-caratula .hoja{border:0;box-shadow:none;max-width:none;padding:0}
 #v-caratula .pt,#v-caratula .ps,#v-caratula .card,#v-caratula .pbtn{display:none!important}
}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:11px}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
label{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:13px 0 4px}
label i{font-style:normal;text-transform:none;letter-spacing:0;opacity:.85}
.inp{width:100%;font-family:inherit;font-size:14px;padding:8px 10px;border-radius:7px;border:1.5px solid var(--line);
 background:var(--pap);color:var(--tx);min-height:36px}
.inp:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.inp.mal{border-color:var(--bad)}
textarea.inp{min-height:84px;line-height:1.5;font-size:13.5px;resize:vertical}
textarea.inp.largo{min-height:130px}
/* el «+» de lo que informan los certificados, como en minuta-social */
.inf{border-top:1px solid var(--line);padding-top:10px;margin-top:14px}
.inf-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
.inf-l{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
.inf-estado{font-size:12.5px;color:var(--muted);flex:1 1 14rem;min-width:0}
.inf-estado b{color:var(--tx);font-weight:600}
.inf-estado b.malt{color:var(--bad)}
button.mas{width:30px;height:30px;padding:0;border-radius:50%;border:1.5px solid var(--acc);background:var(--pap);color:var(--acc);font-size:19px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none}
button.mas:hover,button.mas[aria-expanded="true"]{background:var(--acc);color:var(--pap)}
button.mas:focus-visible,.menu button:focus-visible,button.quitar:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mas-w{position:relative;flex:none;margin-left:auto}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:5;background:var(--pap);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(15,28,58,.16);padding:6px;min-width:13rem;display:grid;gap:2px}
.menu[hidden]{display:none}
.menu button{font-size:13px;font-weight:500;text-align:left;background:none;border:0;border-radius:7px;padding:8px 10px;color:var(--tx)}
.menu button:hover{background:var(--bone)}
.menu button:disabled{color:var(--muted);background:none;opacity:.6}
.menu button small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.menu .mal{color:var(--bad)}
.inf-items{display:grid;gap:10px;margin-top:10px}
.inf-items:empty{display:none}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:start}
.it .inf-tag{grid-column:1/-1;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--acc)}
.it.mal .inf-tag{color:var(--bad)}
.it textarea.inp{min-height:58px}
.it .sin{font-size:12.5px;color:var(--bad);padding:6px 0}
.it .hint{grid-column:1/-1;margin:0}
button.quitar{width:26px;height:26px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--pap);color:var(--muted);font-size:15px;font-weight:400;line-height:1;margin-top:4px}
button.quitar:hover{color:var(--bad);border-color:var(--bad)}
.eco{font-size:11.5px;color:var(--muted);margin-top:3px;min-height:1em}
.eco.ok{color:var(--ok)}
.eco.mal{color:var(--bad)}
.pbtn{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap;align-items:center}
.pbtn .der{margin-left:auto}
.adj{border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:11px;background:var(--bone)}
.adj .ah{display:flex;align-items:center;gap:10px;margin-bottom:2px;flex-wrap:wrap}
.adj .ah b{color:var(--acc);font-size:13.5px}
.adj .ah .der{margin-left:auto;display:flex;gap:6px}
.sexo button.p{pointer-events:none}
.apanel{background:var(--pap);border:1.5px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:14px}
.apanel .ph{background:var(--acc);color:#fff;padding:11px 15px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:13.5px}
.apanel .ph .n{margin-left:auto;font-weight:600;font-size:12px;opacity:.9}
.apanel .pb{padding:14px 15px}
.fijo{margin:6px 0 0;font-size:13.5px;color:var(--muted);font-style:italic}

/* ── el barrio y sus tandas, en el tablero ── */
.firmas{background:var(--pap);border:1.5px solid var(--line);border-radius:11px;padding:6px 20px;margin-bottom:6px}
.tf{display:grid;grid-template-columns:72px minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.tf:last-of-type{border-bottom:0}
.tf-l b,.tf-r b{display:block;font-size:15px}
.tf-l span,.tf-r span{display:block;font-size:12px;color:var(--muted)}
.tf-dias{font-size:11.5px;color:var(--muted);line-height:1.15}
.tf-dias b{display:block;font-size:34px;line-height:1;color:var(--tx);font-variant-numeric:tabular-nums}
.tf.riesgo .tf-dias b{color:var(--bad)}
@media(max-width:700px){.tf{grid-template-columns:1fr;gap:4px}}
.barrio{background:var(--pap);border:1.5px solid var(--line);border-left:5px solid var(--acc);border-radius:11px;margin-bottom:14px;overflow:hidden}
.bh{display:flex;align-items:center;gap:12px;padding:14px 17px;cursor:pointer;flex-wrap:wrap}
.bh:hover{background:var(--acc-s)}

.bh .der{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.bh .fl{color:var(--muted);font-size:12px;width:14px}
.bc{padding:0 17px 15px;border-top:1px solid var(--line)}
.barrio.plegado .bc{display:none}
.bh .fl{display:inline-block}
.barrio.plegado .bh .fl{transform:rotate(-90deg)}
/* Movimiento suave (Baltasar, 03/11/2026: «que no sea algo tan repentino»). Nada de esto
   corre si la computadora tiene pedido menos movimiento. Si el Chrome no sabe animar hasta
   «auto», el barrio se pliega igual, sin la animación. */
@media (prefers-reduced-motion:no-preference){
 :root{interpolate-size:allow-keywords}
 .v.on{animation:vistaEntra .2s ease-out}
 @keyframes vistaEntra{from{opacity:0;transform:translateY(6px)}}
 .bc{overflow:hidden;height:auto;transition:height .26s ease,padding .26s ease,border-color .26s,visibility 0s}
 .barrio.plegado .bc{display:block;height:0;padding-top:0;padding-bottom:0;border-top-color:transparent;visibility:hidden;transition:height .26s ease,padding .26s ease,border-color .26s,visibility 0s .26s}
 .bh .fl{transition:transform .22s ease}
 .dialogo.on{animation:fondoEntra .16s ease-out}
 .dialogo.on .caja{animation:dlgEntra .2s ease-out}
 @keyframes fondoEntra{from{opacity:0}}
 @keyframes dlgEntra{from{opacity:0;transform:translateY(10px) scale(.985)}}
 button,tr.fila,.inp,.bandeja .fb{transition:background-color .15s,border-color .15s,box-shadow .15s,color .15s}
}
.dato{margin:10px 0;font-size:13px;color:var(--muted)}

.tanda{margin:6px 0 16px}
.tanda .th{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;padding:8px 0 6px;border-bottom:1.5px solid var(--line);margin-bottom:2px}

.tanda .th .sep{color:var(--line)}
.tanda .th .der{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
tr.fila{cursor:pointer}
.bandeja{padding:4px 14px}
.bandeja .fb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}
.bandeja .fb:last-child{border-bottom:0}
.bandeja .fb:hover{background:var(--acc-s)}
.bandeja .fb span:not(.et){color:var(--muted)}
.bandeja .fb .et{margin-left:auto}
.revision{margin-top:16px;border-top:1px solid var(--line);padding-top:6px}

.cambios .cb{display:flex;gap:6px;flex-wrap:wrap;padding:5px 0;border-bottom:1px dashed var(--line)}
.cambios .cb span{margin-left:auto;color:var(--muted);font-size:12px}
tr.fila:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.tanda td input.mini.resp{font-family:inherit;font-size:13px;padding:4px 8px;border-radius:6px;border:1.5px solid var(--line);background:var(--pap);color:var(--tx);width:140px}
.tanda td input.mini.resp:placeholder-shown{border-style:dashed}
.tanda td select.mini.esc{font-family:inherit;font-size:13px;padding:4px 6px;border-radius:6px;border:1.5px solid var(--line);background:var(--pap);color:var(--tx);max-width:150px}
.reparto{font-size:13px;color:var(--muted);margin:8px 0 4px}
.reparto b{color:var(--tx);font-weight:600}
.reparto .rojo{color:var(--bad);font-weight:600}
.reparto .sep{color:var(--line);margin:0 8px}
.tanda .th input.mini{font-family:inherit;font-size:12.5px;padding:3px 7px;border-radius:6px;border:1.5px solid var(--line);background:var(--pap);color:var(--tx);width:120px}
.tanda .th input.mini.fecha{width:106px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 9px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--acc-s)}
td.nom{font-size:15px;font-weight:700;line-height:1.3}
td.lm{font-size:12.5px;color:var(--muted);white-space:nowrap}
td.acc{text-align:right;white-space:nowrap}
td .chica{font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
td .obsx{font-size:11.5px;color:var(--warn);margin-top:3px;font-weight:400}

.et.ok{color:var(--ok);background:var(--ok-bg)}
.et.no{color:var(--muted);background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.et.wa{color:var(--warn);background:var(--warn-bg)}

/* ── la base: se lee como escritura y se marca encima ── */
.escritura{font-family:Cambria,Georgia,serif;font-size:15px;line-height:1.95;text-align:justify;
 background:var(--pap);border:1.5px solid var(--line);border-radius:11px;padding:20px 22px;white-space:pre-wrap;overflow-wrap:anywhere}
.escritura:focus{outline:2px solid var(--acc);outline-offset:2px}
.escritura.chico{font-size:14px;line-height:1.85}
.mk{background:var(--marca);box-shadow:inset 0 0 0 1px var(--marca-bd);color:var(--marca-tx);border-radius:3px;padding:0 2px;cursor:pointer}
.mk::after{content:attr(data-k);font-family:Montserrat,sans-serif;font-style:normal;font-size:8.5px;letter-spacing:.04em;
 font-weight:700;color:var(--muted);vertical-align:super;margin-left:2px;user-select:none}
.escritura .hueco-base{background:var(--bad-bg);box-shadow:inset 0 0 0 1px var(--bad);color:var(--bad);border-radius:3px;padding:0 1px;font-weight:inherit;font-style:inherit}
.mk.pend{background:var(--bad-bg);box-shadow:inset 0 0 0 1px var(--bad);color:var(--bad)}
.mk.vacio{padding:0 4px}
.hueco{color:var(--bad);font-weight:700}
.cambio{background:var(--cel-bg);box-shadow:inset 0 -2px 0 var(--cel)}
.paleta{border:1.5px solid var(--acc);border-radius:11px;background:var(--pap);padding:14px 16px;box-shadow:0 16px 40px rgba(15,28,58,.14);margin-bottom:14px}
.paleta .ph2{font-size:12.5px;margin:0 0 3px}
.paleta .ph2 b{color:var(--acc)}
.paleta .alc{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:13px 0 6px}
.paleta .alc span{font-size:10px;letter-spacing:0;text-transform:none;font-weight:500;opacity:.85;margin-left:6px}
.mkbtns{display:flex;gap:6px;flex-wrap:wrap}
.mkb{font-family:Montserrat,sans-serif;font-size:11px;font-weight:600;border-radius:6px;padding:4px 9px;border:1.5px solid var(--line);background:var(--pap);color:var(--tx);cursor:pointer}
.mkb:hover{border-color:var(--acc)}
.mkb.usada{background:var(--marca);border-color:var(--marca-bd)}
.mkb.usada::after{content:" ✓";color:var(--ok)}
.sabe{width:100%;border-collapse:collapse;font-size:12.5px}
.sabe td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
.sabe td:first-child{font-family:Montserrat,sans-serif;font-weight:700;color:var(--acc);white-space:nowrap}
.sabe tr:last-child td{border-bottom:0}
.datos label{margin:10px 0 3px}
.datos label:first-child{margin-top:0}
.datos .inp{min-height:32px;padding:5px 8px;font-size:13px}
.sug{display:flex;gap:9px;align-items:flex-start;padding:8px 9px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;cursor:pointer;font-size:12.5px}
.sug input{width:auto;margin-top:3px}
.sug .ctx{color:var(--muted);font-size:11.5px;margin-top:2px}
.sug .ctx b{color:var(--acc)}
.tag{font-family:Montserrat,sans-serif;font-size:10px;font-weight:700;color:var(--acc);background:var(--acc-s);border-radius:4px;padding:1px 5px}
.herr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
/* «¿Qué es?», al lado de lo que se seleccionó en la base (05/11/2026) */
.flota{position:absolute;z-index:60;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:min(560px,calc(100vw - 24px));background:var(--pap);border:1.5px solid var(--acc);border-radius:11px;padding:8px 10px;box-shadow:0 12px 32px rgba(15,28,58,.18);font-size:12.5px}
.flota[hidden]{display:none}
#marcaQuitar,#marcaFlota{z-index:35} /* por debajo de la barra fija de arriba: al bajar, pasan por abajo como el texto */
.flota .q{font-weight:700;color:var(--acc);margin-right:2px}
.flota button{width:auto;margin:0;padding:5px 10px;font-size:12.5px;border-radius:999px;border:1px solid var(--line);background:var(--bone);color:var(--tx);cursor:pointer;font-family:inherit}
.flota button.p{background:var(--acc);color:var(--boton-tx,#fff);border-color:var(--acc)}
.flota button.x{border:0;background:transparent;color:var(--muted);padding:5px 6px}
.sug select.sugk{width:auto;max-width:100%;font-size:12px;padding:3px 6px;margin:0 0 3px}

.guia-marca li b{display:inline;margin:0}

/* ── la minuta del lote, por partes ── */
.partes .parte{background:var(--pap);border:1.5px solid var(--line);border-radius:11px;padding:14px 18px;margin-bottom:12px}
.partes .parte h3{margin:0 0 4px;font-size:16px;color:var(--acc);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.partes .parte h3 .aclara{font-size:12px;font-weight:500;color:var(--muted)}
.comova p.n{margin:0 0 4px;font-size:15px}
.comova button{width:100%;margin-top:8px}
.comova .lista{font-size:12.5px;color:var(--muted);margin:0 0 10px;padding-left:18px}
.pie{margin-top:22px;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.6}
.dialogo{position:fixed;inset:0;background:rgba(15,28,58,.45);z-index:70;display:none;align-items:center;justify-content:center;padding:18px}
.dialogo.on{display:flex}
.dialogo .caja{background:var(--pap);border-radius:12px;padding:20px 22px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dialogo .caja p{margin:0 0 14px;font-size:14px}
/* la grilla del alta, con la columna «Inmueble» (12/11/2026): entra entera en una pantalla de 1366 */
.dialogo .caja.ancho{max-width:1180px;max-height:calc(100vh - 36px);overflow:auto}
/* una ventanita más alta que la pantalla (la del R:, con lo de casa, en el celular) se corre adentro:
   si no, lo de arriba y los botones de abajo quedaban fuera, sin manera de llegar (12/11/2026) */
.dialogo .caja{max-height:calc(100vh - 36px);overflow:auto}
/* desde casa: lo que va y vuelve por mail, en la misma ventanita (12/11/2026) */

.casa-dlg .st{margin:12px 0 4px}
.casa-dlg .pbtn{margin-top:10px}
/* subir lo de casa: con qué barrio de la oficina va cada uno de casa (12/11/2026) */
.plan-casa{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.plan-casa>p{margin:0 0 6px}
.plan-casa .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.plan-base label{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:4px 0;cursor:pointer}

/* la grilla de alta de lotes: una fila por lote, los adjudicatarios adentro */
.tanda-w{overflow-x:auto}
.tanda{width:100%;border-collapse:collapse;font-size:13px;min-width:1100px}
.tanda td.inm .inp{display:block;width:100%;margin-bottom:4px}
.tanda th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 4px 5px}
.tanda td{padding:6px 4px;vertical-align:top;border-top:1px solid var(--line)}
.tanda .inp{padding:6px 8px;font-size:13.5px;min-height:32px}
.tanda .adjf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 112px 26px;gap:4px;margin-bottom:4px;align-items:start}
.tanda .adjf button.quitar{margin-top:3px}
.tanda button.chico{font-size:12px;padding:3px 9px;margin-top:1px}
@media print{.cinta,.top,.pbtn,.comova,aside,#aviso{display:none!important}.escritura{border:0;padding:0}}

/* ═══ DISEÑO D (02/11/2026) ═══
   La capa común de SIGEC. Va al final para pisar lo de arriba sin reescribirlo. La barra de
   arriba sigue siendo la cáscara que no cambia —el camino y los botones—, con el ícono y sin
   el filete de color; el terracota queda en el ícono, el botón principal y los títulos de
   tarjeta que ya lo usaban. La carátula impresa no cambia de forma: sólo de letra. */
:root{--bone:#F6F7F9;--line:#E4E7EC;--campo:#D0D5DD;--muted:#5B6478;--tx:#172033;--pap:#fff;
 --ok:#067647;--ok-bg:#ECFDF3;--warn:#B54708;--warn-bg:#FFFAEB;--bad:#B42318;--bad-bg:#FEF3F2;--cel:#175CD3;--cel-bg:#EFF8FF;--boton-tx:#fff;
 --viv-d:#D6E6FF;--viv-d-bd:#84ADFF;--viv-p:#EBE4FF;--viv-p-bd:#6941C6}
html[data-theme="dark"]{--bone:#0F1420;--line:#262F42;--campo:#344054;--muted:#98A2B3;--tx:#E6EAF2;--pap:#161C2B;
 --ok:#75E0A7;--ok-bg:#0E2A1C;--warn:#FEC84B;--warn-bg:#33240A;--bad:#FDA29B;--bad-bg:#3A1714;--cel:#84CAFF;--cel-bg:#102A56;--boton-tx:#1F0E09;
 --viv-d:#1D3B70;--viv-d-bd:#528BFF;--viv-p:#35246B;--viv-p-bd:#BDB4FE}
.tile{flex:0 0 auto;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:var(--t);color:#fff}
html[data-theme="dark"] .tile{background:var(--to);color:var(--tt)}
body,.hoja,.mk::after,.mkb,.sabe td:first-child,.tag{font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif}
body{font-size:15px}
.cinta{display:none}
.top{border-bottom:1px solid var(--line);padding:10px 20px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.top .tile{width:38px;height:38px;border-radius:11px}
.top h1{font-size:18px;font-weight:800;color:var(--tx)}
.top .proto{font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:600;padding:2px 10px}
.top .sub{font-size:13.5px}
.guardado{font-size:12.5px}
button{font-size:14px;border-radius:10px;padding:8px 14px;border-width:1px}
button:hover{border-color:var(--muted)}
button.p{color:var(--boton-tx)}
button.p:hover{border-color:var(--acc);filter:brightness(1.08)}
button.ch{font-size:13px;padding:5px 10px;border-radius:8px}
.pt{font-size:26px;font-weight:800;letter-spacing:-.02em}
.ps{font-size:15px}
.st{font-size:14.5px;letter-spacing:0;text-transform:none;color:var(--tx)}
.hint{font-size:13.5px}
.alerta{border-left:0;border:1px solid currentColor;border-radius:12px}
.avisobox{border-radius:12px}
.card{border-width:1px;border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.04);padding:18px 20px}
.card h2{font-size:16.5px}
.sigue{border-width:1px;border-radius:16px}
input,select,textarea{border-radius:10px}
/* Rótulos con mayúscula inicial, como en todo SIGEC. La carátula impresa (.hoja) no se toca:
   copia el formulario de papel. */
label,.inf-l,.it .inf-tag,th,.et,.paleta .alc{text-transform:none;letter-spacing:0}
label{font-size:13px;font-weight:600;color:var(--tx)}
th{font-size:12.5px;font-weight:600}
.et{font-size:12px;font-weight:600}
.hoja th{text-transform:uppercase;letter-spacing:.06em}
/* ═══ LA REVISIÓN CON LA ESCRIBANA (03/11/2026) ═══
   La hoja es la minuta: sombreado lo que sale de los datos (amarillo, del lote; celeste, de la
   tanda o la manzana), sin sombrear la base. Lo que cambió después de una revisión, en naranja,
   que es el color de «hay que revisarlo». */
.franja-rev{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--acc-s);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 14px}

@media(max-width:700px){.franja-rev label{margin-left:0}.franja-rev .inp{width:100%}}
.info-rev{background:var(--cel-bg);color:var(--cel);border-radius:10px;padding:11px 14px;font-size:14px;line-height:1.5;margin:0 0 14px}
.rev{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
@media(max-width:1040px){.rev{grid-template-columns:minmax(0,1fr)}}
.rev>*{min-width:0}

.rev-nav{display:flex;align-items:center;gap:8px;justify-content:space-between}

.rev-panel{position:sticky;top:calc(var(--alto-top,59px) + 15px);max-height:calc(100vh - var(--alto-top,59px) - 31px);overflow:auto;padding-right:2px}

.rev-hoja .escritura{font-size:16px;line-height:1.95;padding:28px 32px 28px 48px}
@media(max-width:700px){.rev-hoja .escritura{padding:18px 16px;font-size:15px}}
.rev-hoja .escritura{background:#fff;color:#111}
.rev-hoja .escritura.plegada{text-align:left}
.rev-hoja .dt{border-radius:3px;padding:0 2px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.rev-hoja .dl{background:#FFF1BF}
.rev-hoja .dg{background:#E3EEFB}
/* cambiado sólo en esta escritura: antes llevaba «pt», la clase del título, y salía en letra de 26 px (18/11/2026) */
.rev-hoja .dpr{background:#F4F0FF}
.rev-hoja .bs[data-ri]{cursor:pointer}
.rev-hoja .bs[data-ri]:hover{background:#F2F4F7}

.rev-hoja .cambio{background:#FEF0C7;box-shadow:inset 0 -2px 0 #DC6803}
.rev-hoja .pliegue{display:inline-block;font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:12.5px;font-weight:600;color:#5B6478;background:#F2F4F7;border-radius:999px;padding:1px 10px;margin:0 2px;line-height:1.6}
.rev-hoja .imprime{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:12px;font-weight:600;color:#5B6478;border:1px dashed #98A2B3;border-radius:4px;padding:0 6px}
.rev-box h3{margin:0 0 6px;font-size:15px;font-weight:800}
.rev-box .n{font-size:14px;margin:0 0 6px}
.rev-box .cb{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.rev-box .cb:last-child{border-bottom:0}

  if(k.startsWith("l:")){ for(const b of DB.barrios){ const u=ubicar(b,k.slice(2)); if(u) return "el lote "+loteCorto(u.l)+" ("+nombreLote(u.l)+") de "+b.nombre+", que otra computadora había cambiado"; } return ""; }
  const p=k.slice(2).split("/"), b=bDe(p[0]); if(!b) return "";
  const que=por==="hijos"?"que tiene lotes que otra computadora le había dado de alta":"que otra computadora había cambiado";
  if(k.startsWith("b:")) return "el barrio «"+b.nombre+"», "+que;
  const t=b.tandas.find(x=>x.id===p[1]); return t?"la tanda «"+(t.resolucion?"Resolución "+t.resolucion:"sin resolución")+"» de "+b.nombre+", "+que:""; }).filter(Boolean);
 if(!ds.length) return;
 avisar("Volvió lo que se había borrado, porque quien lo borró no veía lo último: "+ds.join("; ")+". Si sobra, borralo de nuevo (una tanda o un barrio, después de sus lotes).",true);
 if(VISTA.v==="tablero") refrescarVista();
}

function ajustarCrece(el){ if(!el||el.tagName!=="TEXTAREA") return; el.style.height="auto"; el.style.height=(el.scrollHeight+2)+"px"; }
document.addEventListener("input",e=>{ if(e.target&&e.target.classList&&e.target.classList.contains("crece")) ajustarCrece(e.target); },true);

const IDBC={ abrir(){ return new Promise((ok,mal)=>{ if(!window.indexedDB) return mal(new Error("sin IndexedDB")); const r=indexedDB.open("sigec-sociales",1); r.onupgradeneeded=()=>r.result.createObjectStore("k"); r.onsuccess=()=>ok(r.result); r.onerror=()=>mal(r.error); }); },
 async leer(k){ const db=await this.abrir(); return new Promise(ok=>{ const q=db.transaction("k").objectStore("k").get(k); q.onsuccess=()=>ok(q.result||null); q.onerror=()=>ok(null); }); },
 async borrar(k){ const db=await this.abrir(); return new Promise(ok=>{ const tx=db.transaction("k","readwrite"); tx.objectStore("k").delete(k); tx.oncomplete=()=>ok(true); tx.onerror=()=>ok(false); }); },
 async poner(k,v){ const db=await this.abrir(); return new Promise(ok=>{ const tx=db.transaction("k","readwrite"); tx.objectStore("k").put(v,k); tx.oncomplete=()=>ok(true); tx.onerror=()=>ok(false); }); } };

/* Qué pasó, dicho para quien está frente a la pantalla. Un error del programa no es «sin
   conexión con el R:»: decirlo así manda a buscar el problema donde no está. */
function motivoComp(e){
 if(e&&e.nube) return {tipo:e.tipo==="permiso"||e.tipo==="clave"?"permiso":"red",txt:e.message};
 const n=(e&&e.name)||"", m=(e&&e.message)||String(e);
 if(!(typeof DOMException!=="undefined"&&e instanceof DOMException)) return {tipo:"programa",txt:"falló el programa, no el R: ("+n+": "+m+"). Pasale este mensaje a quien mantiene SIGEC."};
 if(n==="NotAllowedError"||n==="SecurityError") return {tipo:"permiso",txt:"Chrome no tiene permiso para usar esa carpeta."};
 if(n==="NotFoundError") return {tipo:"red",txt:"la carpeta ya no está donde estaba: se movió, se renombró o el R: no está conectado en esta computadora."};
 if(n==="NoModificationAllowedError"||n==="InvalidModificationError") return {tipo:"red",txt:"Windows no dejó crear ningún archivo en esa carpeta: probé como .json y como .txt, y no anduvo ninguno. Parece que desde Chrome tu usuario no puede escribir ahí. Probá con otra carpeta del R: (por ejemplo, la del turnero) o pedile a sistemas permiso de escritura en esta."};
 if(n==="NotReadableError") return {tipo:"red",txt:"Windows no dejó leer la carpeta."};
 if(n==="QuotaExceededError") return {tipo:"red",txt:"no hay lugar en el disco."};
 return {tipo:"red",txt:n+": "+m};
}
function pedirSync(){ if(!COMP.dir||COMP.estado!=="ok") return; clearTimeout(COMP.tSync); COMP.tSync=setTimeout(sincronizar,1500); }
async function sincronizar(){
 if(!COMP.dir) return;
 if(COMP.ocupado){ COMP.pendiente=true; return; }
 COMP.ocupado=true;
 try{
  /* el texto firmado que se está trayendo del IndexedDB, antes de escribir el archivo (si el IndexedDB
     no contesta, no se espera más de tres segundos: lo que no se trajo viaja como huella y no gana) */
  await Promise.race([CONG.listo,new Promise(r=>setTimeout(r,3000))]);
  if(tGuardar) guardar(true); else sellar();
  /* Nunca se reemplaza un archivo: cada vez que se guarda se escribe uno nuevo, con la hora
     en el nombre (…-<compu>-<hora>.json), y después se borran los propios viejos. En el R:,
     Windows rechazaba el reemplazo (NoModificationAllowedError, 03/11/2026): por permisos de
     la carpeta, o porque otra computadora lo estaba leyendo. Crear uno nuevo no choca con
     ninguna de las dos. De cada computadora se lee el más nuevo que se pueda leer. */
  const miGrupo=PREFIJO_COMP+slugComp(COMP.quien)+"-"+COMP.compu, otros=[], personas=[], mios=[], grupos=new Map();
  COMP.paso="leer la carpeta";
  /* Lo que hay en la carpeta, para poder decir qué pasa cuando no aparece nadie más (una
     computadora que eligió otra carpeta, o que no puede leer lo de las demás, 05/11/2026). */
  const diag={otrasCosas:0,muestra:[],ilegibles:[]};
  let sub=null; try{ sub=await COMP.dir.getDirectoryHandle(SUB_COMP,{create:true}); }catch(e){ sub=null; }
  for(const dd of sub?[sub,COMP.dir]:[COMP.dir]) for await (const [nombre,h] of dd.entries()){
   if(dd===COMP.dir&&h.kind==="directory"&&nombre===SUB_COMP) continue;
   if(h.kind!=="file"||!nombre.startsWith(PREFIJO_COMP)){ if(dd===COMP.dir){ diag.otrasCosas++; if(diag.muestra.length<6) diag.muestra.push(nombre+(h.kind==="directory"?"\\":"")); } continue; }
   const m=/^(.*-[a-z0-9]{4})(?:-(\d{10,}))?\.(?:json|txt)$/.exec(nombre); if(!m){ diag.otrasCosas++; continue; }
   /* de esta misma computadora, aunque antes haya dicho otro nombre: es lo propio, se reemplaza */
   if(m[1]===miGrupo||m[1].endsWith("-"+COMP.compu)){ mios.push({nombre,d:dd}); continue; }
   (grupos.get(m[1])||grupos.set(m[1],[]).get(m[1])).push({ts:+(m[2]||0),nombre,h});
  }
  const destino=sub||COMP.dir;
  const vigentes=new Set();
  for(const lista of grupos.values()){
   lista.sort((x,y)=>y.ts-x.ts); let leido=false, err="";
   for(const {nombre,h} of lista){
    let c=COMP.cache.get(nombre);
    /* Un archivo a medio escribir, vacío o bloqueado un instante no corta nada: se prueba
       con el anterior de esa misma computadora. */
    try{
     const f=await h.getFile();
     if(!c||c.t!==f.lastModified||c.n!==f.size){
      const d=JSON.parse(await f.text());
      if(d&&d.app==="sigec-sociales"&&Array.isArray(d.barrios)){ normalizarTodos(d); c={t:f.lastModified,n:f.size,d}; COMP.cache.set(nombre,c); } else{ c=null; err="no es un archivo de Escrituras sociales"; }
     }
    }catch(e){ c=null; err=((e&&e.name)||"")+(e&&e.message?": "+e.message:""); COMP.avisoLectura=nombre+": "+err; }
    if(c){ vigentes.add(nombre); otros.push(c.d); personas.push({quien:c.d.quien||nombre,cuando:c.d.escrito||c.t,lotes:(c.d.barrios||[]).reduce((s,b)=>s+(b.tandas||[]).reduce((u,t)=>u+(t.lotes||[]).length,0),0)}); leido=true; break; }
   }
   if(!leido&&lista.length) diag.ilegibles.push({nombre:lista[0].nombre,cuantos:lista.length,err});
  }
  for(const n of [...COMP.cache.keys()]) if(!vigentes.has(n)) COMP.cache.delete(n);
  await sumarPropio(mios,otros);
  COMP.paso="juntar lo de todos";
  /* lo que se cambió mientras se leía la carpeta se sella ahora, antes de juntar: si no, la foto
     nueva lo incluye sin sello y el desempate puede deshacerlo (revisión, 03/11/2026) */
  if(tGuardar) guardar(true); else sellar();
  const propio=SYNC_PROPIO||JSON.stringify(DB.cargos||{})!==COMP.cargosVistos||JSON.stringify(DB.modelos||{})!==COMP.modelosVistos;
  /* Si ningún archivo cambió desde la vuelta anterior, juntar no trae nada (11/11/2026): lo de acá ya
     tiene todo lo de esos archivos, y lo hecho después acá le gana. Antes se juntaba todo, de todas
     las computadoras, en cada vuelta: cada diez segundos en todas, y en cada pausa en la que tipea.
     Son los mismos si son los mismos objetos del caché, que se vuelve a leer sólo cuando un archivo
     cambia de fecha o de tamaño (también con la carpeta nueva y con el caché vaciado). No se saltea
     después de una vuelta fallida (catch), ni mientras se deja vivo un lote borrado que se está
     tipeando (fusionar lo dice): ahí la vuelta siguiente tiene que juntar. Lo que llega de la otra
     ventana de esta computadora se junta en el momento (evento «storage») y sale igual con lo propio. */
  const antes=COMP.fusionados, mismos=!!antes&&antes.length===otros.length&&otros.every(d=>antes.includes(d));
  COMP.fusionados=otros.slice();
  const entro=mismos?false:fusionar(otros);
  COMP.cargosVistos=JSON.stringify(DB.cargos||{}); COMP.modelosVistos=JSON.stringify(DB.modelos||{});
  const datos={app:"sigec-sociales",version:1,quien:COMP.quien,compu:COMP.compu,barrios:DB.barrios.filter(b=>!ES_EJEMPLO(b)),borrados:DB.borrados,cargos:DB.cargos||{},modelos:DB.modelos||{}};
  const txt=jsonCong(datos,"r"); /* lo congelado, entero: lo leen también las computadoras con la versión de antes */
  /* Se escribe cuando hay algo hecho acá (10/11/2026). Antes, cada cambio de una computadora lo
     volvían a escribir entero todas las demás, que no habían tocado nada: unos 195 MB por minuto
     por el R: con una sola persona cargando. Lo que sólo vino de otra se escribe igual, pero a lo
     sumo cada dos minutos: así llega también a la computadora que no puede leer el archivo de
     la que lo hizo. */
  /* lo que ya está tal cual en el archivo no queda pendiente (un cambio que se hizo y se volvió atrás) */
  if(mios.length&&txt===COMP.escrito){ SYNC_PROPIO=false; COMP.pendienteNube=false; }
  /* En GitHub, no más de una vez cada NUBE_T.min: lo pendiente queda marcado (el chip y el cierre lo miran) y sale
     solo cuando se cumple el plazo, o en el momento si la ventana se oculta o se cierra (COMP.nubeYa). Y sólo lo
     propio: lo que vino de otra ya está en GitHub, en el archivo de quien lo hizo (no hay rebote). */
  /* la computadora puente reescribe lo suyo en cuanto le llega algo de las demás: es lo que sube a GitHub, para casa */
  const puenteAca=!enNube()&&!!nubeCfg();
  const dtN=Date.now()-(COMP.tEscrito||0), aEscribir=!mios.length||(txt!==COMP.escrito&&(propio||(puenteAca&&entro)||(!enNube()&&dtN>REBOTE_COMP)));
  const esperaNube=enNube()&&aEscribir&&mios.length&&!COMP.nubeYa&&dtN>=0&&dtN<NUBE_T.min;
  COMP.nubeYa=false; /* es de una sola vuelta: ocultar o cerrar fuerza la de ahora, no las que vengan */
  if(esperaNube){ COMP.pendienteNube=true; clearTimeout(COMP.tNube); COMP.tNube=setTimeout(()=>sincronizar(),NUBE_T.min-dtN+300); }
  if(!esperaNube&&aEscribir){
   COMP.paso="guardar tu archivo en la carpeta"; SYNC_PROPIO=false;
   /* El R: bloquea archivos por la extensión (los .bat, verificado el 15/10). El 03/11 no dejó
      crear ni un .json: la carpeta quedó vacía. Si .json no anda se prueba .txt, y la que ande
      queda recordada en esta computadora. Los dos se leen igual. */
   const escribir=async ext=>{
    const nuevo=miGrupo+"-"+Date.now()+ext; COMP.miArchivo=nuevo;
    for(let i=0;;i++){
     try{
      const h=await destino.getFileHandle(nuevo,{create:true}); const w=await h.createWritable();
      await w.write(jsonCong(Object.assign({escrito:Date.now()},datos),"r")); await w.close(); return;
     }catch(e){
      if(i>=2||enNube()||(e&&(e.name==="NotAllowedError"||e.name==="SecurityError"))){ try{ await destino.removeEntry(nuevo); }catch(e2){} throw e; }
      await new Promise(r=>setTimeout(r,700*(i+1)));
     }
    }
   };
   CONG.vistosR=new Set(); /* lo congelado que va en este archivo (ver enRCong) */
   const ext=lsLeer("sigec_sociales_ext")||".json";
   try{ await escribir(ext); }
   catch(e){
    if(enNube()||(e&&(e.name==="NotAllowedError"||e.name==="SecurityError"))) throw e;
    const otra=ext===".json"?".txt":".json";
    try{ await escribir(otra); lsPoner("sigec_sociales_ext",otra); }
    catch(e2){ COMP.probadas=true; throw e2; }
   }
   COMP.escrito=txt; COMP.noBorra=false; COMP.tEscrito=Date.now(); enRCong(CONG.vistosR); CONG.vistosR=null; COMP.pendienteNube=false;
   for(const x of mios){ if(x.d===destino&&x.nombre===COMP.miArchivo) continue; try{ await x.d.removeEntry(x.nombre); }catch(e){ COMP.noBorra=true; } }
  }
  if(!COMP.miArchivo||!(COMP.miArchivo.startsWith(miGrupo))) COMP.miArchivo=mios.map(x=>x.nombre).sort().slice(-1)[0]||"";
  diag.mios=mios.length; diag.grupos=grupos.size; COMP.diag=diag;
  COMP.personas=personas.sort((a,b)=>b.cuando-a.cuando); COMP.ultima=Date.now(); COMP.error=""; COMP.estado="ok"; COMP.errSeguidos=0;
  if(entro){ refrescarVista(); vigilarListas(); }
  asegurarCarpetas();
  /* el puente con GitHub, en una computadora de la oficina que tiene la llave */
  if(!enNube()&&nubeCfg()) setTimeout(()=>puenteNube(),200);
 }catch(e){
  /* lo propio que no se pudo escribir se vuelve a probar en la vuelta siguiente, y se vuelve a juntar */
  SYNC_PROPIO=true; COMP.fusionados=null;
  const mo=motivoComp(e);
  COMP.error="No pude "+(COMP.paso||"empezar")+": "+mo.txt; COMP.detalle=((e&&e.name)||"")+" — "+((e&&e.message)||String(e));
  COMP.estado=mo.tipo==="permiso"?"permiso":"error"; COMP.tipoError=mo.tipo; COMP.errSeguidos=(COMP.errSeguidos||0)+1;
 }finally{
  COMP.ocupado=false; pintarCompartido();
  if(COMP.pendiente){ COMP.pendiente=false; setTimeout(sincronizar,300); }
 }
}
/* Lo de afuera se ve apenas no haya nada a medio escribir: redibujar con alguien tipeando le
   saca el cursor. Si no se puede ahora, se hace en la vuelta siguiente o al volver al tablero. */
function escribiendoAhora(){ const a=document.activeElement; return !!a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable); }
/* Con texto seleccionado tampoco: redibujar se lleva la selección, y el Ctrl+C de después copia
   lo que había antes en el portapapeles (10/11/2026). */
function seleccionando(){ const s=window.getSelection(), v=$("#v-"+VISTA.v); return !!s&&s.rangeCount>0&&!s.isCollapsed&&!!v&&v.contains(s.anchorNode); }
function refrescarVista(){
 /* …ni con algo escrito y sin guardar en la revisión, aunque el cursor ya no esté ahí: redibujar lo borraba (20/11/2026) */
 if($("#dialogo").classList.contains("on")||escribiendoAhora()||seleccionando()||revSinGuardar()){ COMP.repintar=true; return; }
 COMP.repintar=false;
 /* La base se redibuja sólo si lo de afuera le cambió el texto (BASE_AJENA): si no, quedaba la
    pantalla vieja y la siguiente tecla pisaba la corrección de la otra persona (10/11/2026). */
 if(VISTA.v==="base"){ const bb=bDe(VISTA.b); if(!bb){ ir("tablero"); return; }
  if(BASE_AJENA===VISTA.b){ pintarBase(); avisar("La base cambió en otra computadora: ahora se ve como quedó."); }
  else{ pintarDatosBarrio(bb); pintarDeshacer(); } }
 else if(VISTA.v==="tablero") pintarTablero();
 else if(VISTA.v==="lote") pintarLote();
 else if(VISTA.v==="texto") pintarTexto();
 else if(VISTA.v==="caratula") pintarCaratula();
 else if(VISTA.v==="revision") pintarRevision();
}
function arrancarReloj(){
 /* el puente con GitHub anda también con la ventana oculta o minimizada (Chrome lo espacia, a lo sumo una vez por
    minuto, y alcanza): si no, lo de casa no llegaba (revisión del 13/11/2026) */
 if(!COMP.relojPuente) COMP.relojPuente=setInterval(()=>{ if(document.hidden&&nubeCfg()&&COMP.dir&&!enNube()&&COMP.estado==="ok") sincronizar(); },30000);
 if(COMP.reloj) return;
 COMP.reloj=setInterval(()=>{ if(document.hidden) return; if(COMP.repintar) refrescarVista(); if(COMP.estado==="ok"||COMP.estado==="error") sincronizar(); },10000);
 document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&(COMP.estado==="ok"||COMP.estado==="error")) sincronizar(); });
}
/* El botón llama a esto en el mismo clic: Chrome sólo abre el selector si viene de un clic. */
async function conectarCarpeta(elegir){
 try{
  let dir=elegir?null:COMP.dir;
  if(!dir) dir=await window.showDirectoryPicker({mode:"readwrite",id:"sigec-sociales"});
  const p=await dir.requestPermission({mode:"readwrite"});
  if(p!=="granted"){ avisar("Sin permiso no se puede compartir. Volvé a tocar el botón y elegí «Permitir».",true); return; }
  /* en una carpeta nueva lo de acá se escribe en la primera vuelta: hasta que se escribe, cada vuelta lee y
     junta el archivo propio (sumarPropio) aunque no haya cambiado (11/11/2026) */
  if(dir!==COMP.dir){ COMP.cache=new Map(); COMP.escrito=""; COMP.tEscrito=0; }
  COMP.fusionados=null; /* al conectar, siempre se junta */
  COMP.dir=dir; COMP.estado="ok"; await IDBC.poner("carpeta",dir); lsPoner("sigec_sociales_carpeta",dir.name);
  try{ localStorage.removeItem("sigec_sociales_nube_casa"); }catch(e){}
  /* conectada al R:, ya no es una computadora de casa */
  { const oc=casaInfo(); if(oc.casa||oc.sinMandar){ delete oc.casa; delete oc.sinMandar; casaPoner(oc); } }
  await sincronizar(); arrancarReloj();
  if(COMP.estado==="ok"&&!COMP.personas.length) avisar((COMP.diag&&COMP.diag.ilegibles.length)?"Conectado a «"+dir.name+"», pero esta computadora no puede leer el archivo de las demás: es un permiso de la carpeta. Tocá el botón naranja de arriba para ver cuál.":"Conectado a «"+dir.name+"», pero ahí no hay ninguna otra computadora. Si las demás ya comparten, no es la misma carpeta: tocá el botón naranja de arriba para ver cómo comprobarlo.",true);
  else if(COMP.estado==="ok") avisar("Conectado al R:, carpeta «"+dir.name+"». Probé leer y guardar y anda: lo que cargues lo ven todos, y lo de ellos aparece acá solo.");
  else avisar("Elegiste «"+dir.name+"», pero no quedó conectado. "+COMP.error,true);
 }catch(e){ if(e&&e.name==="AbortError") return; avisar("No se pudo usar la carpeta: "+((e&&e.message)||e),true); }
}

/* Una computadora de casa con lo de allá (barrios, o marcas de lo que allá se borró) no se conecta al R: así: lo de
   casa se mezclaría tal cual, sin las reglas de «Importar el avance», con barrios y lotes repetidos, y lo borrado en
   casa borraría acá. Primero se guarda y se sube; después se saca lo de casa de esta computadora. */
/* Desde «Trabajar desde casa» se hizo algo (queda anotado hasta guardarlo) o se guardó: si no, lo que hay es de antes
   (una computadora de la oficina que tocó «Trabajar desde casa» por error) y no se bloquea (13/11/2026). */
const conLoDeCasa=()=>{ const o=casaInfo(); return !!o.casa&&(casaPendiente().n>0||!!o.mandado)&&(DB.barrios.some(b=>!ES_EJEMPLO(b))||Object.keys(DB.borrados||{}).length>0); };
function bloqueoCasa(reiniciar){

   reemplaza; el nombre con la hora, el que usa sincronizar, va adentro («nombre»). Nunca se borra un nombre con hora:

  if(this.dir===NUBE_DIR){ yield [SUB_COMP,{kind:"directory",name:NUBE_SUB}]; return; }
  for(const x of await nubeListar(cfg,this.dir)){

/* La copia de casa (h) de un registro de la oficina (o). Se reescribe la hora de cada campo de h para que

 /* cuándo entra lo de casa si acá está vacío, y cuándo si los dos dicen distinto */

 const avisa=k=>primera||casaDesde(k);

  if(r==="casa") casa(k); else ofi(k);

    una «Y» o una «O» suelta antes de otra palabra («E» antes de «I», «U» antes de «O»), es la
    palabra que sigue y no la letra del lote. Tampoco la que sigue un apóstrofo o un «°»: «Mza 14

  else{

/* Una fila del anexo de la resolución, copiada de Excel: más de dos números cortos (el n° de orden y
   la manzana y el lote catastrales y oficiales), y el titular, que es la columna de texto que va
   antes de un documento. Trae además el departamento, la localidad y el barrio, y el teléfono y la
   matrícula, que no son del adjudicatario (10/11/2026). */

  /* la cuenta (doce números) y la nomenclatura (dieciséis, o diecinueve con P.H.), con guiones o sin */
  else if(/^\d{2}-\d{2}-\d{7}-\d$/.test(x)||/^\d{12}$/.test(x)) out.push(FORMATOS.cuenta.fmt(soloDig(x)));
  else if(/^\d{2}(?:-\d{2}){4}-\d{3}-\d{3}(?:-\d{3})?$/.test(x)||/^(?:\d{16}|\d{19})$/.test(x)) out.push(FORMATOS.nomen.fmt(soloDig(x)));
  /* en una fila del anexo, de lo que no es número corto, sólo el titular y su documento —y el
     cotitular y el suyo, como otra persona—: el resto no es del adjudicatario y no se carga */
  else if(anexo){ const txt=y=>/\p{L}/u.test(y||"")&&!corto(y)&&!ES_DNI(y);

/* Quién es escribana lo dice cada computadora al conectarse («Sos»); a cuál le toca cada lote

/* El modo administrador (Baltasar, 12/11/2026: «borrar un barrio, ¿por qué no puedo? Dame la opción a mí de

   el nombre o «BORRAR»— y se cambian los datos de los firmados y los inscriptos (el texto firmado queda
   como salió). No aprueba por la escribana: la revisión sigue atada a la computadora del cargo
   (decisión del 03/11/2026). Arriba, al lado de quién sos, se ve que está prendido. */
const ADMIN=()=>lsLeer("sigec_sociales_admin")==="1";

/* Dos revisiones, como dice el circuito (Baltasar, 03/11/2026). La primera es de quien

   persona, en la computadora del cargo (ver «la revisión con la escribana»): desde las demás se
   ve y no se toca. «Queda pendiente» es sólo para cuando falta un papel. */
/* Borrar un lote (04/11/2026): con cada pasante dando de alta los suyos, un expediente puede
   quedar cargado dos veces. Sólo en confección: lo que ya pasó a revisión no se borra. El
   borrado viaja a las demás computadoras como cualquier otro cambio. */
/* «Borrar el lote» va arriba a la derecha desde el 12/11/2026 (Baltasar: «tiene que estar a la derecha»),
   y sólo mientras el lote está en confección */
/* Qué lote se puede borrar (Baltasar, 12/11/2026: «no me deja borrar un lote», uno de prueba que había
   quedado como revisado sin una revisión válida). Hasta hoy, sólo en confección. Ahora también en
   revisión, pendiente, o revisado sin una revisión que cuente —la que no salió de la computadora del
   cargo—. No: el impreso, el firmado, el inscripto, ni el revisado de verdad por la escribana. */
function puedeBorrarse(l){

const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipear(archivos){
 const enc=new TextEncoder(), partes=[], centrales=[]; let off=0;
 archivos.forEach(({nombre,texto})=>{
  const nom=enc.encode(nombre), dat=enc.encode(texto), c=crc32(dat);
  const lh=new DataView(new ArrayBuffer(30));
  lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(12,0x21,true);
  lh.setUint32(14,c,true); lh.setUint32(18,dat.length,true); lh.setUint32(22,dat.length,true); lh.setUint16(26,nom.length,true);
  partes.push(new Uint8Array(lh.buffer),nom,dat);
  const cd=new DataView(new ArrayBuffer(46));
  cd.setUint32(0,0x02014b50,true); cd.setUint16(4,20,true); cd.setUint16(6,20,true); cd.setUint16(8,0x0800,true); cd.setUint16(14,0x21,true);
  cd.setUint32(16,c,true); cd.setUint32(20,dat.length,true); cd.setUint32(24,dat.length,true); cd.setUint16(28,nom.length,true); cd.setUint32(42,off,true);
  centrales.push(new Uint8Array(cd.buffer),nom);
  off+=30+nom.length+dat.length;
 });
 let cdLargo=0; centrales.forEach(p=>cdLargo+=p.length);
 const eo=new DataView(new ArrayBuffer(22));
 eo.setUint32(0,0x06054b50,true); eo.setUint16(8,archivos.length,true); eo.setUint16(10,archivos.length,true); eo.setUint32(12,cdLargo,true); eo.setUint32(16,off,true);
 const todo=partes.concat(centrales,[new Uint8Array(eo.buffer)]);
 let total=0; todo.forEach(p=>total+=p.length);
 const out=new Uint8Array(total); let i=0; todo.forEach(p=>{out.set(p,i);i+=p.length;});
 return out;
}

 const r=fundir(runs).map(x=>{ const pr=(x.b?"<w:b/>":"")+(x.u?'<w:u w:val="single"/>':""); return "<w:r>"+(pr?"<w:rPr>"+pr+"</w:rPr>":"")+'<w:t xml:space="preserve">'+xml(x.t)+"</w:t></w:r>"; }).join("");
 const doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:pPr><w:spacing w:line="570" w:lineRule="atLeast"/><w:jc w:val="both"/></w:pPr>'+r+'</w:p><w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1984" w:right="964" w:bottom="340" w:left="3005" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>';
 const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>';
 const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
 const drels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
 const sty='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Cambria" w:hAnsi="Cambria" w:cs="Cambria"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="es-AR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:line="570" w:lineRule="atLeast"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>';

/* Descargar el Word es para imprimir: antes se dice si no es la que aprobó la escribana, y si
   está revisada queda una copia con fecha en la carpeta del lote. */
function descargarWord(b,t,l){ verificarAntesDeImprimir(b,t,l,"Descargarla",()=>{ if(descargarWordYa(b,t,l,!["revisada","firmada","inscripta"].includes(l.estado))&&l.estado==="revisada"){ anotarImpresa(b,t,l); guardarCopiaEnR(b,t,l,"impresa").then(x=>avisoCopia(x,"Descargado.")); } }); }
function descargarWordYa(b,t,l,borrador){
 try{
  const {runs,noEsta}=runsDelLote(b,t,l);
  if(noEsta){ avisar("El texto firmado no está en esta computadora: conectala al R: para traerlo.",true); return false; }
  const u8=docxDe(runs);
  const blob=new Blob([u8],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});

  a.download=((borrador?"BORRADOR - ":"")+"Minuta - "+nombreLote(l)+" - Lote "+(l.lote||"")+" Mza "+(l.mza||"")).replace(/[\\/:*?"<>|]/g,"-")+".docx";
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  avisar(borrador?"Descargado como borrador: lo que falta sale como *****. No es para imprimir.":"Descargado. Si no aparece, estás en la copia en línea: abrilo desde la carpeta.");

 }catch(e){ avisar("No se pudo armar el Word: "+e.message,true); return false; }

/* ════════════ LA REVISIÓN CON LA ESCRIBANA, EN SU COMPUTADORA ════════════ */
/* Baltasar (03/11/2026): la corrección no viaja. El auxiliar va a la oficina de la escribana con
   sus expedientes y corrigen juntos, en la computadora de ella. «El centro de este sistema es la
   minuta que se arma»: la sesión es la minuta, se lee y se corrige tocándola. Lo del lote se cambia
   en su campo y la minuta se rearma en el momento; lo de la tanda, la manzana o el barrio avisa
   ANTES a cuántos lotes toca; lo de la base se corrige en la base. La aprobación queda atada a la
   computadora del cargo (DB.cargos) y al texto exacto que se leyó, sin el número ni la fecha, que
   pone quien imprime. Desde otra computadora se ve y no se toca. */
const CARGO_TXT={General:"Escribana General",Sustituta:"Escribana Sustituta"};
const cargoDe=l=>(l&&l.escribana)==="Sustituta"?"Sustituta":"General";
const normN=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
const mismoNombre=(a,b)=>normN(a)!==""&&normN(a)===normN(b);
const quienNombre=()=>String(COMP.quien||lsLeer("sigec_sociales_quien")||"").trim();
function cargoReg(c){ return (DB.cargos&&DB.cargos[c])||null; }
function esCompuDelCargo(){ const c=ROL(); if(c!=="General"&&c!=="Sustituta") return false; if(desdeCasa()) return false; const r=cargoReg(c); return !!r&&!r.libre&&r.compu===COMP.compu; }
/* el cargo con computadora; uno liberado cuenta como sin computadora */
const cargoTomado=c=>{ const r=cargoReg(c); return r&&!r.libre?r:null; };

/* El cargo queda en la primera computadora que lo toma, y se toma a propósito: se pregunta.
   Pasarlo a otra es explícito y queda en rojo en todas las computadoras. Si dos lo toman sin
   verse, al juntarse gana la primera (ganaCargo). */
function tomarCargo(c){
 if(c!=="General"&&c!=="Sustituta") return;
 if(noEnCasa()) return;
 const r=cargoTomado(c), prev=cargoReg(c);
 if(r&&r.compu===COMP.compu){ avisar("Esta computadora ya es la de la "+CARGO_TXT[c]+"."); return; }
 if(r){ avisoCargo(); return; }
 preguntar("<b>¿Esta es la computadora de la "+CARGO_TXT[c]+"?</b><br>Sus minutas se van a revisar desde acá, y desde ninguna otra. Si después hay que cambiarla, se puede, y queda avisado en todas las computadoras.","Sí, es esta",()=>{
  const ahora=Date.now(); DB.cargos=DB.cargos||{};
  /* si el cargo se había liberado, el registro nuevo lleva su pase, para ganarle al libre al juntarse */
  DB.cargos[c]=Object.assign({compu:COMP.compu,quien:quienNombre(),desde:hoy(),reg:ahora,t0:ahora,antes:(prev&&prev.antes)||[],leida:{},mod:ahora},
   prev&&prev.libre?{pase:{t:ahora,de:"",deCompu:"",a:quienNombre(),aCompu:COMP.compu,desdeLibre:true,libero:prev.pase&&prev.pase.de||""}}:{});
  guardar(true); pedirSync(); if(VISTA.v==="tablero") pintarTablero(); else refrescarVista();
  avisar("Listo: esta es la computadora de la "+CARGO_TXT[c]+". Desde acá se revisa.");
 });
}
/* Al elegir «Sos: Escribana …»: si el cargo no tiene computadora, se ofrece tomarlo; si la
   tiene otra, se dice. Va después de que se cierre el diálogo del que viene. */
function trasElegirRol(){ const c=ROL(); if(c!=="General"&&c!=="Sustituta") return; const r=cargoTomado(c); if(r&&r.compu===COMP.compu) return; setTimeout(()=>tomarCargo(c),80); }
/* ¿El registro a del cargo le gana al b? El mismo titular: el más nuevo. Titulares distintos:
   el último pase explícito; sin pases, el que lo tomó primero. */
function ganaCargo(a,b){
 if(a.compu===b.compu&&(a.t0||0)===(b.t0||0)) return (a.mod||0)>(b.mod||0);
 const pa=a.pase?a.pase.t:0, pb=b.pase?b.pase.t:0; if(pa!==pb) return pa>pb;
 return (a.reg||0)!==(b.reg||0)?(a.reg||0)<(b.reg||0):String(a.compu)<String(b.compu);
}
/* Los modelos de minuta (Baltasar, 14/11/2026: «al dar de alta un barrio, elegir el tipo de minuta, y que quede
   guardada; que ya se sepa dónde están las minutas»). Una base guardada con nombre, sin datos de ningún lote,
   para empezar otro barrio desde ahí. Viajan con lo demás, por el R: y por GitHub: de cada modelo gana el
   cambiado más tarde, también si se borró (borrado:true queda como marca). */
function fusionarModelos(fuentes){
 let cambio=false; DB.modelos=esObjPlano(DB.modelos)?DB.modelos:{};
 for(const f of fuentes) for(const [id,m] of Object.entries((f&&esObjPlano(f.modelos)&&f.modelos)||{})){
  if(!esObjPlano(m)||!(m.borrado||Array.isArray(m.runs))) continue; const mio=DB.modelos[id];
  if(!mio||(m.mod||0)>(mio.mod||0)){ DB.modelos[id]=JSON.parse(JSON.stringify(m)); cambio=true; } }
 return cambio;
}
const modelosVivos=()=>Object.entries(esObjPlano(DB.modelos)?DB.modelos:{}).filter(([,m])=>m&&!m.borrado&&Array.isArray(m.runs)&&m.runs.length).sort((a,c)=>String(a[1].nombre).localeCompare(String(c[1].nombre),"es"));
/* una copia de una base, con ids nuevos para sus editables */
const copiarRuns=runs=>runs.map(r=>{ const x=JSON.parse(JSON.stringify(r)); if(x.k||x.pend) x.id=nuevoIdRun(); return x; });
function guardarModelo(b){
 if(!b.base.runs.length){ avisar("Esta base está vacía: no hay nada para guardar.",true); return; }
 const ya=modelosVivos().find(([,m])=>m.de===b.id);
 preguntar('<b>Guardar esta base como modelo</b><br>Queda para empezar otros barrios desde acá, en todas las computadoras. Los datos de los lotes no se guardan.',ya?"Reemplazar el modelo":"Guardar",()=>{
  const n=$("#dlgModelo").value.trim(); if(!n){ $("#dlgModelo").focus(); return false; }
  const id=ya?ya[0]:"m"+Date.now().toString(36); DB.modelos=esObjPlano(DB.modelos)?DB.modelos:{};
  DB.modelos[id]={nombre:n,de:b.id,deNombre:b.nombre,runs:copiarRuns(b.base.runs),quien:quienNombre(),fecha:hoy(),mod:Date.now()};
  guardar(true); pedirSync(); avisar("Guardado el modelo «"+n+"». Aparece al dar de alta un barrio.");
 },'<input class="inp" id="dlgModelo" value="'+esc(ya?ya[1].nombre:"Como "+b.nombre)+'" placeholder="Municipalidad, ampliación">');
 setTimeout(()=>{ const i=$("#dlgModelo"); if(i){ i.focus(); i.select(); } },50);
}
function fusionarCargos(fuentes){
 let cambio=false; DB.cargos=DB.cargos||{};
 for(const f of fuentes) for(const [c,r] of Object.entries((f&&f.cargos)||{})){
  if(!r||(!r.compu&&!r.libre)) continue; const mio=DB.cargos[c];
  if(!mio||ganaCargo(r,mio)){ if(!mio||JSON.stringify(mio)!==JSON.stringify(r)){ DB.cargos[c]=JSON.parse(JSON.stringify(r)); cambio=true; } }
 }
 return cambio;
}
function avisoCargo(){
 if(noEnCasa()) return;
 const c=ROL(), r=cargoTomado(c); if(!r){ tomarCargo(c); return; }
 preguntar("El cargo <b>"+CARGO_TXT[c]+"</b> está en la computadora de <b>"+esc(r.quien||"otra persona")+"</b> (la usa desde el "+esc(r.desde)+"). Desde acá no se revisa.","Entendido",()=>{},

 $("#dlgPasarCargo").onclick=()=>{ $("#dialogo").classList.remove("on"); setTimeout(()=>preguntar("¿Pasar el cargo <b>"+CARGO_TXT[c]+"</b> a esta computadora? La de <b>"+esc(r.quien||"antes")+"</b> deja de poder revisar.","Pasar el cargo",()=>pasarCargo(c)),60); };
}

 if(noEnCasa()) return;
 const r=cargoTomado(c); if(!r){ tomarCargo(c); return; } const ahora=Date.now();
 r.antes=(r.antes||[]).concat({compu:r.compu,quien:r.quien,t0:r.t0||r.reg||0,hasta:ahora});

/* Liberar el cargo (Baltasar, 05/11/2026: «no me deja elegir su rol, dame la opción de reiniciar

   lote de su mitad con su estado y lo que le falta, ordenado por lo que le toca a ella. */
const ALC_FALTA={lote:"del lote",mza:"de la manzana",tanda:"de la tanda",barrio:"del barrio",base:"de la base"};
const GRUPOS_MITAD=[["lista","Listas para revisar","wa"],["volvio","Volvieron por un cambio","wa"],["completa","Completas, sin pasar","ce"],["faltan","En confección","no"],["pendiente","Pendientes","ba"],["revisada","Revisadas","ok"],["firmada","Firmadas","ok"]];
/* lo que le falta a todo el barrio y a la tanda: igual en todos sus lotes, se dice una vez */
function faltaBarrio(b,t){
 if(!b.base.runs.length) return ["la minuta base: todavía no está"];
 const out=[], pend=b.base.runs.filter(r=>r.pend).length;
 if(pend) out.push("en la minuta base, "+pend+" tramo"+(pend>1?"s":"")+" por reemplazar");
 const nom=(a,c)=>{ const d=CAT.find(x=>x.a===a&&x.campo===c); return d?d.r.toLowerCase():c; };
 const fb=camposQuePide(b.base,"barrio").filter(c=>!String(b.datos[c]||"").trim()).map(c=>nom("barrio",c));
 if(fb.length) out.push("datos del barrio: "+fb.join("; "));
 if(t){ const ft=camposQuePide(b.base,"tanda").filter(c=>!String(t[c]||"").trim()).map(c=>c==="fechaFirma"?"la fecha de firma":nom("tanda",c));
  if(ft.length) out.push("de la tanda: "+ft.join("; "));
  if(avisosResolucion(b.base,{b,t}).length) out.push("en la minuta base, marcar la resolución que autoriza esta tanda: cita otra"); }
 return out;
}
function estadoMitad(b,t,l){
 if(l.estado==="inscripta") return {g:"firmada",et:"ok",txt:"Inscripta"};
 if(l.estado==="firmada") return {g:"firmada",et:"ok",txt:"Firmada"+(l.firmada&&l.firmada.fecha?" el "+l.firmada.fecha:"")};
 if(l.estado==="observada") return {g:"pendiente",et:"ba",txt:"Pendiente",det:l.obs?l.obs.texto+" ("+l.obs.fecha+")":""};
 if(l.estado==="revisada"&&!necesitaVolver(b,t,l)) return impresaDistinta(b,t,l)?{g:"revisada",et:"wa",txt:"Reimprimir",det:"revisada; lo impreso el "+l.impresa.fecha+" no es lo que hay ahora"}:{g:"revisada",et:"ok",txt:"Revisada",det:l.revisada&&l.revisada.fecha?"el "+l.revisada.fecha:""};
 if(l.estado==="revisada"){ const u=cambiosDespuesDeAprobar(b,t,l).slice(-1)[0];
  return {g:"volvio",et:"wa",txt:"Volvió por un cambio",det:!revisionCuenta(l)?"la revisión no salió de la computadora del cargo":u?u.q+" "+u.frase:""}; }
 /* en confección o en revisión: qué le falta, del lote y de la manzana (lo del barrio y la tanda va arriba) */
 const f=b.base.runs.length?armarRuns(b.base,ctxDe(b,t,l)).faltas.filter(x=>!x.flojo&&(x.alcance==="lote"||x.alcance==="mza")):[];
 const por={}; f.forEach(x=>(por[x.alcance]=por[x.alcance]||[]).push(x.que));
 const nt=notarialTarde(t,l);
 const det=Object.entries(por).map(([a,qs])=>"falta "+ALC_FALTA[a]+": "+qs.slice(0,4).join("; ")+(qs.length>4?" y "+(qs.length-4)+" más":"")).concat(nt?[nt]:[]).join(" · ");
 if(l.estado==="enRevision") return {g:"lista",et:"wa",txt:"Lista para revisar",det:"la trae "+(l.responsable||"—")+(det?" · "+det:"")};
 if(!b.base.runs.length) return {g:"faltan",et:"no",txt:"En confección",det:"lleva "+(l.responsable||"nadie todavía")+" · los datos se cargan igual"};
 if(!f.length) return {g:"completa",et:"ce",txt:"Completa, sin pasar",det:"la tiene "+(l.responsable||"nadie todavía")+(nt?" · "+nt:"")};
 return {g:"faltan",et:"no",txt:"Faltan "+f.length+" dato"+(f.length>1?"s":""),det:"lleva "+(l.responsable||"nadie todavía")+" · "+det};
}
function mitadLeer(){ try{ const m=JSON.parse(lsLeer("sigec_sociales_mitad")||"{}"); return esObjPlano(m)?m:{}; }catch(e){ return {}; } }
const mitadPlegada=k=>{ const m=mitadLeer(); return k in m?!!m[k]:window.matchMedia("(max-width:600px)").matches; };
function tuMitadHtml(rol){
 let h="";
 DB.barrios.forEach(b=>b.tandas.forEach(t=>{
  const mios=t.lotes.filter(l=>cargoDe(l)===rol); if(!mios.length||mios.every(l=>l.estado==="inscripta")) return;
  const xs=mios.map(l=>({l,e:estadoMitad(b,t,l)})), orden=g=>GRUPOS_MITAD.findIndex(x=>x[0]===g);
  xs.sort((a,c)=>orden(a.e.g)-orden(c.e.g)||cmpLote(a.l,c.l));
  const cuenta=g=>xs.filter(x=>x.e.g===g).length, hechas=cuenta("revisada")+cuenta("firmada"), fb=faltaBarrio(b,t);
  const mk=b.id+"/"+t.id, mpl=mitadPlegada(mk);
  h+='<div class="card mitad'+(mpl?" plegada":"")+'"><div class="mh"><button type="button" class="mh-bt" data-acc="mitad" data-mk="'+esc(mk)+'" aria-expanded="'+(mpl?"false":"true")+'"><span class="fl" aria-hidden="true">▾</span><b>'+esc(b.nombre)+'</b><span>'+(t.resolucion?"Resolución "+esc(t.resolucion)+" · ":"")+(partes(t.fechaFirma)?"firma el "+esc(t.fechaFirma)+" ("+diasTxt(t.fechaFirma)+")":"sin fecha de firma")+'</span><span class="der">'+hechas+' de '+xs.length+' revisadas</span></button></div>'
   +'<div class="barra-mitad" role="img" aria-label="'+GRUPOS_MITAD.filter(g=>cuenta(g[0])).map(g=>g[1]+": "+cuenta(g[0])).join(", ")+'">'+GRUPOS_MITAD.map(g=>cuenta(g[0])?'<i class="g-'+g[0]+'" style="flex:'+cuenta(g[0])+'"></i>':"").join("")+'</div>'
   +'<div class="mcuerpo"><p class="leyenda">'+GRUPOS_MITAD.filter(g=>cuenta(g[0])).map(g=>'<span><i class="g-'+g[0]+'"></i>'+g[1]+' '+cuenta(g[0])+'</span>').join("")+'</p>'
   +(fb.length?'<div class="falta-barrio"><b>A todo el barrio le falta</b>'+esc(fb.join(" · "))+'</div>':"")
   +'<div class="bandeja">'+xs.map(({l,e})=>'<div class="fb" data-acc="lote" data-b="'+b.id+'" data-l="'+l.id+'" tabindex="0"><b>'+esc(loteCorto(l))+'</b><span>'+esc(nombreLote(l))+' · Expte. '+esc(l.expediente||"sin número")+'</span><span class="et '+e.et+'">'+esc(e.txt)+'</span>'+(e.det?'<span class="det">'+esc(e.det)+'</span>':"")+'</div>').join("")+'</div></div></div>';
 }));
 return h?'<h3 class="st">Tu mitad</h3>'+h:"";
}

<!-- Volver a SIGEC (diseño D, 02/11/2026). Sólo cuando la herramienta se abrió sola: adentro
     del menú está el lateral. Es una barra azul arriba y no un botón flotante: el flotante
     tapaba botones de la herramienta («Imprimir recibo»). Lleva el claro/oscuro, que adentro
     del menú está en el pie del lateral. Es igual en todas las herramientas: sólo cambia

<script>
(function(){
  try{ if(window.self !== window.top) return; }catch(e){ return; }
  var NOMBRE='Escrituras sociales';
  document.documentElement.classList.add('suelto');
  var css='.sigec-suelta{flex:0 0 100%;width:100%;display:flex;align-items:center;gap:12px;min-height:58px;box-sizing:border-box;'
    +'padding:8px 14px;background:#172A52;color:#fff;border-bottom:2px solid #C9A84C;'

    +'border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font:inherit;text-decoration:none;cursor:pointer;flex:0 0 auto}'
    +'.sigec-suelta a:hover,.sigec-suelta button:hover{background:rgba(255,255,255,.15)}'
    +'.sigec-suelta .s{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:#C9A84C;color:#172A52;'
    +'font-weight:800;font-size:13px}'
    +'.sigec-suelta .n{font-size:16px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}'
    +'.sigec-suelta button{margin-left:auto;padding:0 12px}'
    +'.sigec-suelta svg{display:block}'
    +'.sigec-suelta :focus-visible{outline:2px solid #C9A84C;outline-offset:2px}'
    +'@media(max-width:560px){.sigec-suelta button span{display:none}}'
    +'@media print{.sigec-suelta{display:none!important}}';
  var LUNA='M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z';
  var SOL='M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4';
  function poner(){
    var st=document.createElement('style'); st.textContent=css; document.head.appendChild(st);
    var bar=document.createElement('div'); bar.className='sigec-suelta';
    var a=document.createElement('a'); a.href='../../index.html'; a.title='Ir al menú de SIGEC';
    a.innerHTML='<span class="s" aria-hidden="true">S</span>Volver a SIGEC';
    /* Si a esta pestaña la abrió el menú de SIGEC (le pone un nombre que empieza con «sigec-»),
       el menú quedó abierto en la de atrás: volver es cerrar esta. Así se vuelve al menú del R:
       también desde la copia de GitHub, que no puede abrir un archivo del disco y llevaba a la
       copia pública, con cuatro herramientas (Baltasar, 03/11/2026). Si no se cierra, va al menú
       de al lado, como antes. */
    if(/^sigec-/.test(window.name||'')){
      a.title='Cierra esta pestaña: el menú de SIGEC quedó abierto en la de atrás';
      a.addEventListener('click',function(e){ e.preventDefault(); try{ window.close(); }catch(x){} setTimeout(function(){ location.href=a.href; },400); });
    }
    var n=document.createElement('span'); n.className='n'; n.textContent=NOMBRE;
    var b=document.createElement('button'); b.type='button';
    function pintar(){
      var osc=window.SIGEC_TEMA&&SIGEC_TEMA.actual()==='oscuro', t=osc?'Modo claro':'Modo oscuro';
      b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
        +'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(osc?SOL:LUNA)+'"/></svg><span></span>';
      b.lastChild.textContent=t; b.title=t; b.setAttribute('aria-label',t);
    }
    b.addEventListener('click',function(){ if(window.SIGEC_TEMA) SIGEC_TEMA.alternar(); });
    document.addEventListener('sigec:tema',pintar); pintar();
    bar.appendChild(a); bar.appendChild(n); bar.appendChild(b);
    document.body.insertBefore(bar,document.body.firstChild);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',poner); else poner();
})();
</script>
