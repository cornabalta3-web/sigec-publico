<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recibo — Escribanía General de Gobierno</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>
/* Modo oscuro de SIGEC. Una sola preferencia, sigec.tema, que vale para la cáscara y para
   todas las herramientas, estén sueltas o adentro del marco. Va en el <head> para que la
   página nunca se dibuje en claro y pegue el salto. Las páginas file:// comparten
   localStorage, así que cambiarlo en un lado lo cambia en todos. */
(function(){
  var K='sigec.tema';
  function aplicar(t){document.documentElement.setAttribute('data-theme',t==='oscuro'?'dark':'light');}
  function leer(){try{var v=localStorage.getItem(K);return (v==='oscuro'||v==='claro')?v:null;}catch(e){return null;}}
  aplicar(leer()||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'oscuro':'claro'));
  window.SIGEC_TEMA={
    actual:function(){return document.documentElement.getAttribute('data-theme')==='dark'?'oscuro':'claro';},
    poner:function(t){try{localStorage.setItem(K,t);}catch(e){}aplicar(t);this.avisar();},
    alternar:function(){this.poner(this.actual()==='oscuro'?'claro':'oscuro');},
    avisar:function(){document.dispatchEvent(new CustomEvent('sigec:tema'));}
  };
  /* Si lo cambian en otra ventana o en el marco de al lado, esta se entera sola. */
  window.addEventListener('storage',function(e){if(e.key===K&&e.newValue){aplicar(e.newValue);window.SIGEC_TEMA.avisar();}});
})();
</script>
<style>
/* ── COLORES ──────────────────────────────────────────────────────────────────────
   Antes cada regla tenia su color escrito y el panel era la misma placa azul oscuro en
   los dos temas. Ahora son fichas: en claro el panel es claro y el azul queda como
   acento —el titulo, el boton, la opcion elegida, el foco—; en oscuro vuelve a ser la
   placa azul. La hoja no participa: es papel y queda blanca siempre. */
:root{
  --fondo:#EDF1F5;
  --panel:#FFFFFF;
  --panel-borde:#DBE2EB;
  --titulo:#16233D;
  --acento:#B08D2E;
  --texto:#1A2434;
  --texto-2:#5D6D85;
  --campo-bg:#FFFFFF;
  --campo-borde:#CFD8E3;
  --foco:#2C5282;
  --foco-halo:rgba(44,82,130,.16);
  --sel-bg:#16233D;
  --sel-fg:#FFFFFF;
  --aviso-bg:#FBF3DC;
  --aviso-borde:#8A6A12;
  --aviso-texto:#7A5E10;
  --mal:#B4532A;
  --sombra-hoja:0 4px 24px rgba(22,35,61,.15);
}
html[data-theme="dark"]{
  --fondo:#0D1319;
  --panel:#16202C;
  --panel-borde:#263241;
  --titulo:#DCE6F6;
  --acento:#C9A84C;
  --texto:#E4EAF2;
  --texto-2:#93A5BE;
  --campo-bg:#0F1A26;
  --campo-borde:#2C3B4C;
  --foco:#5B87C4;
  --foco-halo:rgba(91,135,196,.22);
  --sel-bg:#3A5A93;
  --sel-fg:#F2F6FC;
  --aviso-bg:#2A2416;
  --aviso-borde:#C9A84C;
  --aviso-texto:#E3CC84;
  --mal:#E3936F;
  --sombra-hoja:0 4px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* La interfaz va en Montserrat, como todo SIGEC. La serif se queda donde representa
     papel: el recibo, que se imprime y se pega. Antes el panel tenia tres tipografias
     —Montserrat en el titulo, Arial en etiquetas y botones, y Georgia en los campos de
     carga—. El dato que se tipea no es papel: es interfaz. */
  body {
    font-family: Montserrat, system-ui, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    min-height: 100vh;
    display: flex;
    -webkit-font-smoothing: antialiased;
  }
  .recibo, .recibo * { font-family: "Times New Roman", Times, serif; }

  /* El panel se queda a la vista mientras se desplaza la hoja. La A4 es mas alta que la
     pantalla: si el panel se estira con ella, el boton de imprimir queda abajo de todo. */
  .panel {
    width: 380px;
    min-width: 340px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--panel-borde);
    padding: 26px 24px 22px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    position: sticky;
    top: 0;
    align-self: flex-start;
    height: 100vh;
    overflow-y: auto;
  }

  .marca { display: flex; flex-direction: column; gap: 3px; }
  .marca .filete { display: block; width: 34px; height: 3px; background: var(--acento); border-radius: 2px; margin-bottom: 9px; }
  .marca h1 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; color: var(--titulo); line-height: 1.25; }
  .marca p { font-size: 11.5px; font-weight: 500; color: var(--texto-2); }

  /* Los campos van agrupados: la persona y el acto. Antes eran siete campos en fila con
     un <hr> al medio. */
  .grupo { display: flex; flex-direction: column; gap: 12px; }
  .grupo > h2 {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--texto-2);
    padding-bottom: 7px;
    border-bottom: 1px solid var(--panel-borde);
  }

  /* La etiqueta de cada campo pasa de 10 px en mayusculas a 12 px en caja normal: era el
     texto mas chico de una herramienta que ocho personas usan todos los dias. */
  .campo-lbl { display: flex; flex-direction: column; gap: 5px; }
  .campo-lbl > span { font-size: 12px; font-weight: 500; color: var(--texto-2); }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .panel input[type=text] {
    font-family: inherit;
    font-size: 14px;
    color: var(--texto);
    background: var(--campo-bg);
    border: 1px solid var(--campo-borde);
    border-radius: 7px;
    padding: 9px 11px;
    width: 100%;
    outline: none;
    transition: border-color .12s, box-shadow .12s;
  }
  /* Antes los campos tenian outline:none y nada en su lugar: moviendose con Tab no se
     veia donde estaba parado el foco. */
  .panel input[type=text]:focus { border-color: var(--foco); box-shadow: 0 0 0 3px var(--foco-halo); }
  .panel input[type=text]::placeholder { color: var(--texto-2); opacity: .55; }
  /* Los numeros de un formulario van en cifras de ancho fijo: el DNI y la fecha dejan de
     bailar mientras se tipean. */
  .panel input.num { font-variant-numeric: tabular-nums; letter-spacing: .02em; }

  /* Dos opciones no se esconden adentro de una lista desplegable: se muestran las dos y
     se elige. Vale para el trato y para el formulario. */
  .seg { display: inline-flex; background: var(--campo-bg); border: 1px solid var(--campo-borde); border-radius: 7px; overflow: hidden; }
  .seg.ancho { display: flex; width: 100%; }
  .seg.ancho button { flex: 1; }
  /* El selector de tipo es hijo directo del panel, que es una columna flexible de alto
     fijo. El `overflow: hidden` de arriba le anula la altura minima automatica, asi que
     sin esto el control se encoge a dos pixeles —los bordes— y no se puede apretar. */
  .panel > .seg { flex: none; }
  .seg button {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 500; color: var(--texto-2);
    padding: 9px 13px; transition: background .12s, color .12s;
  }
  .seg button + button { border-left: 1px solid var(--campo-borde); }
  .seg button:hover { color: var(--texto); }
  .seg button[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-fg); font-weight: 600; }
  .seg:focus-within { box-shadow: 0 0 0 3px var(--foco-halo); border-color: var(--foco); }

  /* El trato es el resultado de la deduccion, no el primer paso de la carga: va al lado
     del nombre del que se deduce, no arriba de todo. */
  .trato { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }
  .trato > span { font-size: 12px; font-weight: 500; color: var(--texto-2); }

  /* Los campos que solo valen para un tipo de recibo. La clase la pone el selector
     de arriba, sobre el <body>. */
  body.tipo-otros .solo-ddjj,
  body:not(.tipo-otros) .solo-otros { display: none; }
  body.tipo-otros .row-acto { grid-template-columns: 1fr; }

  .panel select {
    font-family: inherit; font-size: 14px; color: var(--texto);
    background: var(--campo-bg); border: 1px solid var(--campo-borde);
    border-radius: 7px; padding: 9px 11px; width: 100%; outline: none;
  }
  .panel select:focus { border-color: var(--foco); box-shadow: 0 0 0 3px var(--foco-halo); }

  .pista { font-size: 11.5px; line-height: 1.4; color: var(--texto-2); min-height: 16px; }
  .pista button {
    appearance: none; border: 1px solid var(--campo-borde); background: var(--campo-bg);
    cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 600;
    color: var(--texto); padding: 2px 8px; border-radius: 999px; margin-left: 4px;
  }
  .pista button:hover { border-color: var(--foco); }
  .pista.mal { color: var(--mal); }

  .acciones { margin-top: auto; display: flex; flex-direction: column; gap: 9px; }
  /* Un solo boton fuerte. El de limpiar no compite: es texto. */
  .btn-print {
    appearance: none; border: 0; cursor: pointer;
    background: var(--sel-bg); color: var(--sel-fg);
    font-family: inherit; font-size: 13.5px; font-weight: 600; letter-spacing: .01em;
    padding: 13px; border-radius: 8px; transition: filter .12s;
  }
  .btn-print:hover { filter: brightness(1.15); }
  .btn-clear {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 12px; font-weight: 500; color: var(--texto-2);
    padding: 5px; border-radius: 5px;
  }
  .btn-clear:hover { color: var(--texto); text-decoration: underline; }
  /* Abierta suelta aparece el boton flotante "Volver a SIGEC", abajo a la izquierda, que
     tapaba "Limpiar campos" desde que las acciones bajaron al pie del panel. El espacio
     se reserva solo en ese caso: adentro del marco el boton no existe. */
  html.suelto .panel { padding-bottom: 56px; }

  /* En pantalla angosta el panel vuelve a fluir con la pagina. */
  @media (max-width: 860px) {
    body { flex-direction: column; }
    .panel { width: 100%; min-width: 0; height: auto; position: static;
             border-right: 0; border-bottom: 1px solid var(--panel-borde); }
    .acciones { margin-top: 14px; }
  }

  .preview-area {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 30px 28px 60px;
    overflow-y: auto;
  }

  /* La hoja era de 600 x 760: ni grande para leer, ni con la proporcion de una A4
     (1,414). Ahora ocupa el ancho disponible hasta 820 px, guarda la proporcion y el
     texto crece con ella. Lo que se ve en pantalla es lo que sale impreso. */
  .recibo {
    background: white;
    width: 100%;
    max-width: 820px;
    aspect-ratio: 1 / 1.414;
    padding: 8% 9%;
    box-shadow: var(--sombra-hoja);
    font-size: 21px;
    line-height: 1.85;
    color: #111;
    display: flex;
    flex-direction: column;
  }
  @media (max-width: 1100px){ .recibo{ font-size: 19px; } }
  /* El documento se centra en la hoja y la banda institucional queda abajo. Antes todo
     colgaba del borde de arriba: el contenido ocupaba el 30% del alto y los dos tercios
     de abajo quedaban en blanco. El cuerpo ademas subio de 12 a 14 puntos. */
  .hoja-centro { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .recibo-header { margin-bottom: 4%; text-align: center; }
  .recibo-header img { max-height: 90px; max-width: 100%; }
  /* Filete que separa el membrete del documento. Negro y hecho con un BORDE, no con un
     fondo de color, por dos razones que vienen de la impresora real:
       - En la Escribania se imprime en blanco y negro: el dorado salia gris clarito y
         con el toner bajo no se veia.
       - Los colores de FONDO no se imprimen si no esta tildado "Graficos de fondo" en
         el dialogo de impresion, asi que muchas veces no salia nada. Un borde es tinta
         de primer plano y se imprime siempre.
     Dos pixeles y no uno, para que aguante un toner gastado. */
  .hilo { height: 0; border-top: 2px solid #000; margin-bottom: 5%; }
  .recibo-titulo { text-align: center; margin-bottom: 6%; }
  .recibo-titulo h2 { font-size: 1.18em; font-weight: bold; letter-spacing: .14em; line-height: 1.3; }
  .recibo-titulo span { display: block; margin-top: 3px; font-size: .84em; letter-spacing: .05em; }
  .recibo-titulo span:empty { display: none; }
  .recibo-body { text-align: justify; }
  .recibo-body p { margin-bottom: 0; }
  .lbl { font-weight: bold; text-decoration: underline; }
  /* Lugar y fecha de emision: la del dia en que se emite el recibo, que no es la de la
     escritura. Se arma sola con la fecha de hoy. */
  .recibo-lugar { margin-top: 7%; text-align: right; font-size: .95em; }
  /* La regla de formato del sistema: negrita y subrayado para el nombre del compareciente,
     solo negrita para el resto. Antes iban subrayados los seis datos, asi que el DNI y el
     dia pesaban lo mismo que la persona.
     El subrayado abraza al texto; la caja fija de 70 px queda solo para el hueco vacio. */
  .campo { font-weight: bold; padding: 0 1px; }
  .campo.nombre { text-decoration: underline; }
  .aviso-huecos{margin:0;padding:9px 12px;border-left:3px solid var(--aviso-borde);
   background:var(--aviso-bg);color:var(--aviso-texto);border-radius:0 7px 7px 0;
   font-size:12px;line-height:1.45}
  .campo.vacio {
    color: #aaa;
    border-bottom: 1px solid #ccc;
    text-decoration: none;
    font-weight: normal;
    font-style: italic;
    min-width: 70px;
    display: inline-block;
    text-align: center;
    padding: 0 3px;
  }
  /* El filete mide lo mismo que el bloque que firma y el texto va centrado abajo. Antes
     el renglon y las dos lineas estaban alineados a la derecha por separado, asi que los
     bordes no coincidian. */
  /* Con un solo firmante va a la derecha; con dos, uno en cada punta. */
  .recibo-footer { margin-top: 9%; display: flex; justify-content: flex-end; gap: 18px; }
  body.tipo-otros .recibo-footer { justify-content: space-between; }
  body:not(.tipo-otros) #firmaRecibe { display: none; }
  .firma {
    width: 250px;
    text-align: center;
    border-top: 1px solid #222;
    padding-top: 5px;
    font-size: .82em;
    line-height: 1.6;
  }
  /* Banda institucional al pie: llena el blanco de abajo con informacion que sirve.
     El domicilio y el telefono salen de PIE_CONTACTO, en el script. */
  .recibo-banda {
    border-top: 1px solid #000;
    padding-top: 2.5%;
    text-align: center;
    font-size: .62em;
    line-height: 1.5;
    /* Gris mas oscuro que antes: es letra chica, y en gris claro con el toner bajo se
       pierde. El filete queda mas fino que el de arriba a proposito, para que se lea
       como separador y no como otro membrete. */
    color: #333;
  }

  /* ── ESTILOS DE IMPRESIÓN ── */
  @media print {
    /* El margen en cero es lo que saca el encabezado y el pie que Chrome imprime por su
       cuenta —la fecha de impresion, el titulo de la pagina y la direccion del archivo—:
       sin margen de pagina no tiene donde dibujarlos. Los margenes del documento pasan
       a ser el relleno de la hoja, unas lineas mas abajo. */
    @page {
      margin: 0;
      size: A4;
    }

    html, body {
      background: white !important;
      display: block !important;
      width: 100% !important;
      height: auto !important;
    }

    .panel {
      display: none !important;
    }

    /* El boton flotante de volver al menu salia impreso en el papel: es fijo, asi que
       se dibujaba encima de la hoja. Solo aparece con la herramienta abierta suelta, que
       es como la usa todo el mundo, de modo que salia siempre. */
    .volver-sigec {
      display: none !important;
    }

    .preview-area {
      display: block !important;
      padding: 0 !important;
      margin: 0 !important;
      overflow: visible !important;
      width: 100% !important;
    }

    /* Los margenes del documento, que antes los ponia @page. Y la caja tiene que ser
       alta para que la banda del pie llegue abajo, pero menos que la hoja —A4 son
       29,7 cm—: si se pasa, la banda se va sola a una segunda hoja. 28,4 cm deja
       1,3 cm de resguardo. El relleno cuenta adentro, por el box-sizing de arriba. */
    .recibo {
      box-shadow: none !important;
      width: 100% !important;
      max-width: none !important;
      aspect-ratio: auto !important;
      min-height: 28.4cm !important;
      padding: 2.5cm 3cm !important;
      margin: 0 !important;
      font-size: 14pt !important;
      line-height: 1.8 !important;
      display: flex !important;
      flex-direction: column !important;
    }

    .recibo-header {
      margin-bottom: 1cm !important;
      text-align: center !important;
    }

    .recibo-header img {
      max-height: 65px !important;
      max-width: 100% !important;
    }

    .hilo { margin-bottom: 1.1cm !important; }
    .recibo-titulo { margin-bottom: 1.3cm !important; }
    .recibo-lugar { margin-top: 1.6cm !important; }

    .recibo-footer {
      margin-top: 2cm !important;
    }

    .recibo-banda { padding-top: .5cm !important; }

    /* Sin subrayado: en el papel solo lo lleva el nombre del compareciente. */
    .campo {
      font-weight: bold !important;
    }

    /* En pantalla el hueco se ve gris e itálico y se entiende. Impreso se veía negro y
       normal, o sea igual que un dato: "(apellido)" pasaba por el apellido. En el papel
       tiene que ser lo que es: un renglón en blanco para completar a mano. */
    .campo.vacio {
      color: transparent !important;
      font-style: normal !important;
      text-decoration: none !important;
      border-bottom: 1px solid #000 !important;
    }
  }
</style>
</head>
<body>

<div class="panel">
  <header class="marca">
    <span class="filete"></span>
    <h1>Recibo</h1>
    <p>Declaración jurada patrimonial y entrega de documentos</p>
  </header>

  <!-- Dos recibos distintos, no dos herramientas: el de DDJJ lo firma la Escribania
       certificando que alguien presento algo; el otro lo firma quien recibe. -->
  <div class="seg ancho" id="segTipo">
    <button type="button" data-v="ddjj" aria-pressed="true">DDJJ</button>
    <button type="button" data-v="otros" aria-pressed="false">Otros recibos</button>
  </div>

  <section class="grupo">
    <h2>La persona</h2>
    <!-- Nombres primero y apellido despues: es el orden en que se lee del DNI. -->
    <div class="row-2">
      <label class="campo-lbl"><span>Nombres</span>
        <input id="nombres" type="text" placeholder="Juan Carlos" oninput="actualizar()"></label>
      <label class="campo-lbl"><span>Apellido</span>
        <input id="apellido" type="text" placeholder="Pérez" oninput="actualizar()"></label>
    </div>
    <!-- El trato se deduce del nombre, asi que va al lado del nombre y no arriba de todo:
         era el primer campo del formulario y es el unico que no hay que tocar. -->
    <div class="trato solo-ddjj">
      <span>Trato</span>
      <div class="seg" id="segGenero">
        <button type="button" data-v="masculino" aria-pressed="true">el Señor</button>
        <button type="button" data-v="femenino" aria-pressed="false">la Señora</button>
      </div>
    </div>
    <p class="pista solo-ddjj" id="pistaGenero"></p>
    <label class="campo-lbl"><span>DNI</span>
      <input id="dni" class="num" type="text" inputmode="numeric" placeholder="28.456.789" oninput="actualizar()"></label>
  </section>

  <section class="grupo">
    <h2 id="tituloActo">El acto</h2>
    <label class="campo-lbl solo-otros"><span>Qué recibe</span>
      <select id="queRecibe" oninput="actualizar()">
        <option value="primer">Primer testimonio</option>
        <option value="segundo">Segundo testimonio</option>
        <option value="tercer">Tercer testimonio</option>
        <option value="simple">Copia simple</option>
        <option value="certificada">Copia certificada</option>
      </select></label>
    <div class="row-2 row-acto">
      <div class="campo-lbl solo-ddjj"><span>Formulario</span>
        <div class="seg ancho" id="segFormulario">
          <button type="button" data-v="A" aria-pressed="true">“A”</button>
          <button type="button" data-v="B" aria-pressed="false">“B”</button>
        </div>
      </div>
      <label class="campo-lbl"><span>N.º de escritura</span>
        <input id="escritura" class="num" type="text" inputmode="numeric" placeholder="247" oninput="actualizar()"></label>
    </div>
    <p class="pista" id="pistaEscritura"></p>
    <label class="campo-lbl"><span>Fecha de la escritura</span>
      <input id="fecha" class="num" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" oninput="actualizar()"></label>
    <p class="pista" id="pistaFecha"></p>
  </section>

  <section class="grupo">
    <h2>El recibo</h2>
    <!-- La fecha de emision es otra cosa que la de la escritura, y las dos se editan: se
         emiten recibos de escrituras de dias anteriores. Arranca en la de hoy. -->
    <label class="campo-lbl"><span>Fecha del recibo</span>
      <input id="fechaRecibo" class="num" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" oninput="actualizar()"></label>
    <p class="pista" id="pistaRecibo"></p>
  </section>

  <div class="acciones">

<script>
/* ── LO QUE SE EDITA A MANO ──────────────────────────────────────────────────────
   Estas tres cosas no salen de ningun campo del formulario: son fijas de la hoja.
   Para cambiarlas se edita aca y nada mas.

   FIRMA        quien firma el recibo, tal cual sale impreso debajo del filete.
                Nombra a la ESCRIBANIA y no al cargo de quien firma: asi la linea es
                cierta tanto si firma la Escribana General como la Sustituta. No poner
                "Escribana" aca: se probo y hubo que corregirlo.
   PIE_CONTACTO domicilio, telefono y correo de la Escribania, para la banda del pie.
                Vacio hasta que se tengan los datos reales: mientras tanto la banda
                muestra solo el organismo. No inventar nada aca, se imprime.
   LUGAR        la ciudad de emision.                                              */
var FIRMA = ["Escribanía General de Gobierno", "Fiscalía de Estado"];
var PIE_CONTACTO = "";
var LUGAR = "Córdoba";
/* ───────────────────────────────────────────────────────────────────────────────── */

function c(val, ph, clase) {
  if (val) return '<span class="campo' + (clase ? ' ' + clase : '') + '">' + val + '</span>';
  return '<span class="campo vacio">(' + ph + ')</span>';
}

/* Deduccion del sexo por el nombre de pila. Es la misma regla del armador de minutas,
   con su lista de excepciones: termina en A es femenino, salvo las que estan en la lista.
   Solo propone: si la persona elige a mano, no se vuelve a tocar. */
var EXC_F = ["CARMEN","ISABEL","ESTHER","RAQUEL","INES","BEATRIZ","LUZ","MERCEDES","DOLORES",
  "MILAGROS","ROCIO","RUTH","NOEMI","SOL","PAZ","MIRIAM","YAEL","ABIGAIL","NAIR","EVELYN",
  "JAZMIN","MARLENE","JUDITH","EDITH","MARISOL","ANAHI","YESSICA","GUADALUPE","SOLEDAD",
  "AZUL","BELEN","AILEN"];
var EXC_M = ["LUCA","NOA","JEREMIAS","MATIAS","TOMAS","NICOLAS","ANDRES","AGUSTIN","GASTON",
  "ELIAS","JOSE"];
var generoElegido = false;
var genero = "masculino";
var formulario = "A";
var tipo = "ddjj";   /* "ddjj" | "otros" */

/* Lo que se puede recibir. El articulo va con cada uno porque cambia: EL testimonio,
   LA copia. El texto en mayuscula es el que sale impreso. */
var QUE_RECIBE = {
  primer:      { art: "el", txt: "PRIMER TESTIMONIO" },
  segundo:     { art: "el", txt: "SEGUNDO TESTIMONIO" },
  tercer:      { art: "el", txt: "TERCER TESTIMONIO" },
  simple:      { art: "la", txt: "COPIA SIMPLE" },
  certificada: { art: "la", txt: "COPIA CERTIFICADA" }
};

/* Los dos controles de dos opciones se manejan igual: se pinta el elegido y se avisa. */
function pintarSeg(cont, valor) {
  var bs = cont.querySelectorAll("button");
  for (var i = 0; i < bs.length; i++) {
    bs[i].setAttribute("aria-pressed", bs[i].getAttribute("data-v") === valor ? "true" : "false");
  }
}
document.getElementById("segGenero").addEventListener("click", function (ev) {
  var b = ev.target.closest("button"); if (!b) return;
  genero = b.getAttribute("data-v");
  generoElegido = true;      /* elegido a mano: la deduccion no lo vuelve a tocar */
  pintarSeg(this, genero);
  actualizar();
});
document.getElementById("segTipo").addEventListener("click", function (ev) {
  var b = ev.target.closest("button"); if (!b) return;
  tipo = b.getAttribute("data-v");
  pintarSeg(this, tipo);
  document.body.classList.toggle("tipo-otros", tipo === "otros");
  document.getElementById("tituloActo").textContent = (tipo === "otros") ? "Qué se entrega" : "El acto";
  actualizar();
});
document.getElementById("segFormulario").addEventListener("click", function (ev) {
  var b = ev.target.closest("button"); if (!b) return;
  formulario = b.getAttribute("data-v");
  pintarSeg(this, formulario);
  actualizar();
});
function inferSexo(nombres) {
  var pr = (nombres || "").trim().split(/\s+/)[0] || "";
  var N = pr.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
  if (!N) return null;
  if (EXC_F.indexOf(N) >= 0) return "F";
  if (EXC_M.indexOf(N) >= 0) return "M";
  return N.slice(-1) === "A" ? "F" : "M";
}

/* Nombres de pila con la inicial en mayuscula, aunque se escriban todo en minuscula.
   Las particulas de union quedan en minuscula —"Maria de los Angeles"— salvo cuando
   abren el nombre. Separa por espacios y por guiones, asi "ana-maria" sale "Ana-Maria". */
var NEXOS = ["de", "del", "la", "las", "los", "y", "da", "das", "do", "dos"];
function capitalizar(s) {
  var primera = true;
  return String(s || "").toLocaleLowerCase("es-AR").replace(/[^\s-]+/g, function (p) {
    var r = (!primera && NEXOS.indexOf(p) >= 0)
      ? p
      : p.charAt(0).toLocaleUpperCase("es-AR") + p.slice(1);
    primera = false;
    return r;
  });
}

var MESES = ["enero","febrero","marzo","abril","mayo","junio",
             "julio","agosto","septiembre","octubre","noviembre","diciembre"];

/* Mascara dd/mm/aaaa. Solo reescribe si el valor cambio y deja el cursor despues de la
   misma cantidad de digitos. Misma regla que en las demas herramientas. */
function mascaraFecha(el) {
  var antes = el.value, pos = el.selectionStart == null ? antes.length : el.selectionStart;
  var digAntes = antes.slice(0, pos).replace(/\D/g, "").length;
  var d = antes.replace(/\D/g, "").slice(0, 8);
  var sal = d.slice(0, 2);
  if (d.length > 2) sal += "/" + d.slice(2, 4);
  if (d.length > 4) sal += "/" + d.slice(4, 8);
  if (sal === antes) return;
  el.value = sal;
  var i = 0, cont = 0;
  while (i < sal.length && cont < digAntes) { if (/\d/.test(sal[i])) cont++; i++; }
  while (i < sal.length && sal[i] === "/") i++;
  try { el.setSelectionRange(i, i); } catch (err) {}
}

/* DNI: solo digitos, con puntos de miles. */
function mascaraDni(el) {
  var d = el.value.replace(/\D/g, "").slice(0, 8);
  var sal = d.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  if (sal === el.value) return;
  var alFinal = el.selectionStart === el.value.length;
  el.value = sal;
  if (alFinal) { try { el.setSelectionRange(sal.length, sal.length); } catch (err) {} }
}

function partesFecha(t) {
  var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(t || "").trim());
  if (!m) return null;
  var d = +m[1], me = +m[2], a = +m[3];
  if (me < 1 || me > 12 || d < 1) return null;
  /* Antes alcanzaba con d<=31 y la pista confirmaba "31 de febrero". Los días por mes,
     con bisiesto, que es la regla de siempre: divisible por 4, salvo siglo no divisible por 400. */
  var bis = (a % 4 === 0 && a % 100 !== 0) || a % 400 === 0;
  var tope = [31, bis ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][me - 1];
  if (d > tope) return null;
  return { d: d, m: me, a: a };
}

function actualizar() {
  var ap = document.getElementById("apellido").value.trim();
  var no = document.getElementById("nombres").value.trim();
  var pistaG = document.getElementById("pistaGenero");
  if (!generoElegido) {
    var sx = inferSexo(no);
    genero = sx === "F" ? "femenino" : "masculino";
    pintarSeg(document.getElementById("segGenero"), genero);
    if (pistaG) pistaG.textContent = sx ? "Se dedujo del nombre. Cambialo si no corresponde." : "";
  } else if (pistaG) {
    pistaG.textContent = "";
  }
  var dEl = document.getElementById("dni"); mascaraDni(dEl);
  var d  = dEl.value.trim();
  var f  = formulario;
  var e  = document.getElementById("escritura").value.trim();
  var fEl = document.getElementById("fecha"); mascaraFecha(fEl);
  var fe = partesFecha(fEl.value);
  var tr = (genero === "femenino") ? "la Se\u00f1ora" : "el Se\u00f1or";

  /* El apellido va en mayuscula y los nombres con la inicial en mayuscula. Las dos
     cosas se acomodan solas: quien carga tipea corrido, sin tocar el Shift.
     Se acomoda lo que sale impreso y NO el campo: asi escribir nunca pelea con el
     cursor, que es la regla de no romper el foco. */
  if (ap) ap = ap.toLocaleUpperCase("es-AR");
  if (no) no = capitalizar(no);
  var quien = [no, ap].filter(Boolean).join(" ");

  var pista = document.getElementById("pistaFecha");
  if (pista) pista.classList.toggle("mal", !fe && !!fEl.value);
  if (pista) pista.textContent = fe
    ? fe.d + " de " + MESES[fe.m - 1] + " del a\u00f1o " + fe.a
    : (fEl.value ? "Fecha incompleta." : "");

  /* La fecha del recibo: la de emision, que no es la de la escritura. Si falta o no
     existe, sale como hueco y cuenta en el aviso, igual que cualquier otro dato. */
  var frEl = document.getElementById("fechaRecibo"); mascaraFecha(frEl);
  var fr = partesFecha(frEl.value);
  var pistaR = document.getElementById("pistaRecibo");
  if (pistaR) {
    pistaR.classList.toggle("mal", !fr && !!frEl.value);
    pistaR.textContent = fr
      ? "Sale al pie: " + LUGAR + ", " + fr.d + " de " + MESES[fr.m - 1] + " de " + fr.a + "."
      : (frEl.value ? "Fecha incompleta." : "");
  }
  var lf = document.getElementById("lugarFecha");
  if (lf) {
    lf.innerHTML = fr
      ? LUGAR + ", " + fr.d + " de " + MESES[fr.m - 1] + " de " + fr.a + "."
      : LUGAR + ", " + c("", "fecha del recibo") + ".";
  }

  /* ── El recibo de entrega ────────────────────────────────────────────────────
     Lo firma quien recibe, y tambien la Escribania. Por eso el nombre y el DNI no van
     en el texto: van debajo del renglon de firma, que es donde se aclara quien firmo.
     BORRADOR: la formula la escribi yo a partir de lo que pidio Baltasar y falta que la
     confirme. Si cambia, se cambia aca y en ningun otro lado. */
  if (tipo === "otros") {
    var q = QUE_RECIBE[document.getElementById("queRecibe").value] || QUE_RECIBE.primer;
    document.getElementById("tituloHoja").textContent = "RECIBO";
    document.getElementById("subtituloHoja").textContent = "";
    document.getElementById("cuerpo").innerHTML =
      '<p><span class="lbl">RECIB\u00cd</span> de la Escriban\u00eda General de Gobierno de la ' +
      'Provincia de C\u00f3rdoba, ' + q.art + ' <strong>' + q.txt + '</strong> de la Escritura N\u00b0\u00a0' +
      c(e, "nro. escritura") +
      ' de fecha ' + c(fe ? String(fe.d) : "", "d\u00eda") +
      ' de ' + c(fe ? MESES[fe.m - 1] : "", "mes") +
      ' del a\u00f1o ' + c(fe ? String(fe.a) : "", "a\u00f1o") + '.-</p>';

    var fRec = document.getElementById("firmaRecibe");
    fRec.innerHTML = c(quien, "aclaraci\u00f3n", "nombre") +
                     '<br>DNI ' + c(d, "DNI");
    return;
  }

  document.getElementById("tituloHoja").textContent = "CONSTANCIA DE RECEPCI\u00d3N";
  document.getElementById("subtituloHoja").textContent = "Declaraci\u00f3n Jurada Patrimonial";
  document.getElementById("cuerpo").innerHTML =
    '<p><span class="lbl">CERTIFICO:</span> que ' + tr + ' ' + c(quien, "apellido y nombres", "nombre") +
    ', Documento Nacional de Identidad n\u00famero ' + c(d, "DNI") +
    ' ha presentado el <strong>Formulario \u201c' + f + '\u201d</strong>' +
    ' de su Declaraci\u00f3n Jurada Patrimonial, el cual fue transcripto y labrado en Escritura N\u00b0\u00a0' +
    c(e, "nro. escritura") +
    ', Secci\u00f3n \u201cB\u201d de fecha ' + c(fe ? String(fe.d) : "", "d\u00eda") +
    ' de ' + c(fe ? MESES[fe.m - 1] : "", "mes") +
    ' del a\u00f1o ' + c(fe ? String(fe.a) : "", "a\u00f1o") + '.-</p>';
}

/* ── LA MEMORIA DEL ULTIMO NUMERO ────────────────────────────────────────────────
   Guarda el ultimo numero de escritura que se imprimio EN ESTA MAQUINA, con la hora.
   La Seccion "B" lleva solo declaraciones juradas (Baltasar, 22/10/2026), asi que el
   que sigue es el ultimo mas uno.

   Por que no lo rellena siempre: el dato vive en el navegador de cada computadora, asi
   que una maquina que no se uso en dos dias tiene un numero viejo. Rellenarlo igual
   pondria un numero equivocado en un documento que se entrega firmado, y nadie lo
   miraria porque el campo ya estaria lleno.

   Entonces: si el ultimo se imprimio HOY en esta maquina, lo propone solo —es la tanda
   del dia, el caso de todos los dias—. Si es de otro dia, no toca el campo: muestra cual
   fue y cuando, y deja un boton para usarlo. El que decide es el que imprime.

   Entre maquinas todavia no se comparte: para eso hace falta algo que pueda ESCRIBIR en
   el disco R, y una pagina file:// adentro del marco de SIGEC no puede. Esta anotado en
   el NOTAS con los dos caminos posibles. */
var CLAVE_ULTIMA = "recibo_ultima_escritura";

function leerUltima() {
  try {
    var v = JSON.parse(localStorage.getItem(CLAVE_ULTIMA) || "null");
    return (v && typeof v.n === "number" && v.n > 0) ? v : null;
  } catch (e) { return null; }
}

function recordarUltima(n) {
  try { localStorage.setItem(CLAVE_ULTIMA, JSON.stringify({ n: n, ts: Date.now() })); }
  catch (e) { /* almacenamiento lleno o bloqueado: no proponer es molesto, no grave */ }
}

function proponerEscritura() {
  var pista = document.getElementById("pistaEscritura");
  var campo = document.getElementById("escritura");
  if (!pista || !campo) return;
  pista.textContent = "";

  var u = leerUltima();
  if (!u) return;

  var d = new Date(u.ts), h = new Date();
  var mismoDia = d.getDate() === h.getDate() && d.getMonth() === h.getMonth() &&
                 d.getFullYear() === h.getFullYear();
  var hora = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  var cuando = mismoDia ? "hoy a las " + hora
    : String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") +
      "/" + d.getFullYear();

  if (mismoDia) {
    campo.value = String(u.n + 1);
    pista.textContent = "Sigue al " + u.n + ", que se imprimió " + cuando +
                        ". Cambialo si no es el que va.";
    actualizar();
    return;
  }

  pista.textContent = "El último en esta máquina fue el " + u.n + ", el " + cuando + ". ";
  var b = document.createElement("button");
  b.type = "button";
  b.textContent = "Usar " + (u.n + 1);
  b.onclick = function () {
    campo.value = String(u.n + 1);
    pista.textContent = "Sigue al " + u.n + ", el último de esta máquina.";
    actualizar();
    campo.focus();
  };
  pista.appendChild(b);
}

function imprimir() {
  actualizar();
  var huecos = document.querySelectorAll(".recibo .campo.vacio").length;
  var av = document.getElementById("avisoHuecos");
  if (huecos) {
    av.style.display = "block";
    av.textContent = huecos === 1
      ? "Ojo: queda 1 dato sin cargar. Sale impreso como un renglón en blanco para completar a mano."
      : "Ojo: quedan " + huecos + " datos sin cargar. Salen impresos como renglones en blanco para completar a mano.";
  } else {
    av.style.display = "none";
  }
  /* Se anota al imprimir y no al tipear: el numero se gasta cuando sale el papel. */
  var n = parseInt(document.getElementById("escritura").value.replace(/\D/g, ""), 10);
  if (n > 0) recordarUltima(n);
  window.print();
}

function limpiar() {
  /* La fecha NO se borra: se hacen varios recibos el mismo dia y volver a tipearla
     cada vez es trabajo sin sentido. */
  ["nombres","apellido","dni","escritura"].forEach(function(id) {
    document.getElementById(id).value = "";
  });
  generoElegido = false;
  genero = "masculino";
  formulario = "A";
  pintarSeg(document.getElementById("segGenero"), genero);
  pintarSeg(document.getElementById("segFormulario"), formulario);
  document.getElementById("avisoHuecos").style.display = "none";
  actualizar();
  /* Despues de imprimir uno se aprieta Limpiar y viene el siguiente de la tanda: es
     justo el momento en que proponer el numero que sigue sirve. */
  proponerEscritura();
}

/* Firma y banda del pie: salen de las constantes de arriba y no cambian nunca.
   La fecha de emision NO esta aca: es un campo, porque se emiten recibos de escrituras
   de dias anteriores y entonces no coincide con la de hoy. La arma actualizar(). */
(function () {
  var f = document.getElementById("firma");
  if (f) {
    f.textContent = "";
    for (var i = 0; i < FIRMA.length; i++) {
      if (i) f.appendChild(document.createElement("br"));
      f.appendChild(document.createTextNode(FIRMA[i]));
    }
  }

  var b = document.getElementById("bandaPie");
  if (b) {
    b.textContent = "Escribanía General de Gobierno · Fiscalía de Estado · Provincia de Córdoba";
    if (PIE_CONTACTO) {
      b.appendChild(document.createElement("br"));
      b.appendChild(document.createTextNode(PIE_CONTACTO));
    }
  }
})();

/* Las dos fechas arrancan en la de hoy: casi siempre el recibo se emite el mismo dia de
   la escritura. Si hace falta otra, se cambia una vez y queda, porque Limpiar campos no
   borra ninguna de las dos. */
(function () {
  var h = new Date();
  var hoy = String(h.getDate()).padStart(2, "0") + "/" +
            String(h.getMonth() + 1).padStart(2, "0") + "/" + h.getFullYear();
  document.getElementById("fecha").value = hoy;
  document.getElementById("fechaRecibo").value = hoy;
})();

proponerEscritura();

actualizar();
</script>
